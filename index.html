'bad','Declined',e.declineWhy?esc(e.declineWhy):'By you') : s==='Approved' ? st('done','Approved',fd(((e.logs||[]).find(l=>/approved/i.test(l.e))||{}).t?.slice(0,10)||e.depPaid||'')) : st('now','Approve',`By ${fd(e.expire)}`));\n  if(d) steps.push(ds==='paid' ? st('done',`Deposit paid`,`${usd(d)} · ${fd(e.depPaid)}`) : s==='Declined' ? st('','Pay deposit','Not needed') : st(s==='Approved'||e.depReq?'now':'','Pay deposit',`${usd(d)}${e.depReq&&s!=='Approved'?' · required to approve':''}`));\n  if(b) steps.push(s==='Approved' ? st('done','Booking confirmed',b.no) : s==='Declined' ? st('','Booking confirmed','Not confirmed') : st('','Booking confirmed',b.no));\n  return `<section class=\"card sec\" style=\"margin-bottom:24px\"><h2>Progress<\/h2><ol class=\"flow\">${steps.join('')}<\/ol><\/section>`;\n}\nfunction vEstimate(){\n  const e=S.ests.find(x=>x.no===S.sel); if(!e){ S.route='estimates'; return vEstimates(); }\n  const s=estStatus(e), b=e.bk&&S.bks.find(x=>x.no===e.bk), c=estCalc(e), d=c.dep, ds=depState(e), pr=depPaidRec(e);\n  const good = t => `<div class=\"note\" style=\"background:var(--good-bg);color:#0d5e44\">${t}<\/div>`;\n  const banner = s==='Sent' ? (d\n      ? `<div class=\"note\"><b>Approve this estimate and pay the deposit of ${usd(d)}${e.bk?` to confirm booking ${e.bk}`:''}.<\/b> ${e.depReq?'The deposit is required to approve. ':''}Please respond by ${fd(e.expire)}. The rest, ${usd(r2(c.total-d))}, is billed on your invoices.<\/div>`\n      : `<div class=\"note\"><b>Awaiting your response.<\/b> Approve or decline this estimate by ${fd(e.expire)}.${e.bk?` Approving confirms booking ${e.bk}.`:''}<\/div>`)\n    : s==='Approved' ? (ds==='due'\n      ? `<div class=\"note w\"><b>Deposit of ${usd(d)} is due.<\/b> You approved this estimate. Pay the deposit so ${esc(BILLER.name)} can schedule the guards. <button class=\"lnk\" data-act=\"estPayDep\" data-no=\"${e.no}\">Pay deposit<\/button><\/div>`\n      : ds==='paid' ? good(`<b>Approved and deposit paid.<\/b> ${usd(pr.amount)} paid on ${fd(pr.date)}${pr.ref?` with ${esc(pr.method)}`:' (recorded by DSS)'}.${e.bk?` Booking ${e.bk} is confirmed.`:''} The remaining ${usd(r2(c.total-d))} is billed on your invoices.`)\n      : good(`<b>Approved.<\/b>${e.bk?` Booking ${e.bk} is confirmed.`:''} Charges will appear on your invoices once service is delivered.`))\n    : `<div class=\"note n\"><b>You declined this estimate.<\/b> ${e.declineWhy?'Reason: '+esc(e.declineWhy):''}<\/div>`;\n  const acts = s==='Sent' ? `<button class=\"btn sec\" data-act=\"estDecline\">Decline<\/button><button class=\"btn pri\" data-act=\"estAccept\">${d?`${I.pay}Approve and Pay Deposit`:'Approve Estimate'}<\/button>`\n    : s==='Approved' && ds==='due' ? `<button class=\"btn pri\" data-act=\"estPayDep\" data-no=\"${e.no}\">${I.pay}Pay Deposit ${usd(d)}<\/button>` : '';\n  return `${crumbs(['Estimates','estimates'],[`Estimate ${e.no}`])}\n  <div class=\"ph\"><button class=\"iconbtn\" data-act=\"go\" data-r=\"estimates\" aria-label=\"Back to estimates\">${I.back}<\/button><h1>Estimate ${e.no}<\/h1>${pill(EST_CLS,s)}${d?`<span class=\"st ${ds==='paid'?'paid':s==='Approved'?'overdue':'pending'}\">${ds==='paid'?'Deposit paid':s==='Approved'?'Deposit due':'Deposit requested'}<\/span>`:''}<span class=\"sp\"><\/span>\n    <button class=\"btn ${acts?'ghost':'sec'}\" data-act=\"estDl\" data-no=\"${e.no}\">${I.dl}Download<\/button>${acts}<\/div>\n  ${banner}\n  ${estFlow(e)}\n  <div class=\"dgrid\">\n    <section class=\"card sec\"><h2>Estimate Information<\/h2><dl class=\"dl\">\n      <div><dt>Estimate Number<\/dt><dd>${e.no}<\/dd><\/div><div><dt>Estimate Date<\/dt><dd>${fd(e.date)}<\/dd><\/div><div><dt>Expiry Date<\/dt><dd>${fd(e.expire)}<\/dd><\/div>\n      <div><dt>Booking<\/dt><dd>${e.bk?`<button class=\"lnk\" data-act=\"bkOpen\" data-no=\"${e.bk}\">${e.bk}<\/button>`:'—'}<\/dd><\/div><div><dt>Post Site<\/dt><dd>${esc(estSite(e))}<\/dd><\/div><div><dt>PO Number<\/dt><dd>${esc(e.po||'—')}<\/dd><\/div>\n      ${b?`<div><dt>Service<\/dt><dd>${bkType(b)}<\/dd><\/div><div><dt>Service Dates<\/dt><dd>${schedWhen(b.scheds[0])}<\/dd><\/div><div><dt>Status<\/dt><dd>${pill(EST_CLS,s)}<\/dd><\/div>`:''}<\/dl>\n      <div style=\"margin-top:18px\"><dt style=\"color:var(--muted);font-size:13px;font-weight:500\">Summary<\/dt><p style=\"margin:5px 0 0;line-height:1.5\">${esc(e.summary)}<\/p><\/div>\n      ${e.notes?`<p class=\"sub\" style=\"margin-top:12px;font-size:13.5px;line-height:1.5\"><b style=\"color:var(--fg-2)\">Notes:<\/b> ${esc(e.notes)}<\/p>`:''}<\/section>\n    <section class=\"card sec\"><h2>Summary<\/h2>\n      <div class=\"sumr\"><span>Subtotal<\/span><b class=\"num\">${usd(c.sub)}<\/b><\/div>\n      <div class=\"sumr\"><span>Tax<\/span><b class=\"num\">${c.tax?usd(c.tax):'No tax'}<\/b><\/div>\n      <div class=\"sumr\"><span>Discount<\/span><b class=\"num\">${c.disc?'−'+usd(c.disc):'—'}<\/b><\/div>\n      <div class=\"sumr big\"><span style=\"color:var(--fg)\">Total<\/span><b class=\"num\">${usd(c.total)}<\/b><\/div>\n      ${d?`<div class=\"sumr due ${ds==='paid'?'zero':''}\"><span>${depLbl(e)}<span class=\"sub\" style=\"font-weight:400\">${ds==='paid'?`Paid ${fd(e.depPaid)}`:s==='Declined'?'Not needed':e.depReq&&s==='Sent'?'Required to approve':'Due on approval'}<\/span><\/span><b class=\"num\">${usd(d)}<\/b><\/div>\n        <div class=\"sumr\"><span>Billed later on invoices<\/span><b class=\"num\">${usd(r2(c.total-d))}<\/b><\/div>\n        ${acts && s!=='Declined'?`<button class=\"btn pri\" style=\"width:100%;justify-content:center;margin-top:14px\" data-act=\"${s==='Sent'?'estAccept':'estPayDep'}\" data-no=\"${e.no}\">${I.pay}${s==='Sent'?'Approve and Pay':'Pay'} ${usd(d)}<\/button>`:''}`:''}\n    <\/section><\/div>\n  <section class=\"card\" style=\"margin-top:24px\"><div class=\"sec\" style=\"padding-bottom:6px\"><h2 style=\"margin:0\">Products and Services<\/h2><\/div><div class=\"tw\"><table><thead><tr><th>Product or Service<\/th><th>Description<\/th><th class=\"r\">Qty<\/th><th class=\"r\">Rate<\/th><th class=\"r\">Tax<\/th><th class=\"r\">Amount<\/th><\/tr><\/thead><tbody>\n    ${e.lines.map(l=>{ const p=prodOf(l); return `<tr><td>${esc(p.name)}<\/td><td style=\"color:var(--fg-2)\">${esc(p.desc)}<\/td><td class=\"r num\">${l.qty}<\/td><td class=\"r num\">${usd(l.rate)}<span class=\"sub\">${unitTxt(p.unit)}<\/span><\/td><td class=\"r num\">${l.tax?r2(l.tax*100)+'%':'—'}<\/td><td class=\"r num\">${usd(lineAmt(l))}<\/td><\/tr>`; }).join('')}\n  <\/tbody><\/table><\/div><\/section>\n  ${d?`<section class=\"card\" style=\"margin-top:24px\"><div class=\"sec\" style=\"padding-bottom:6px\"><h2 style=\"margin:0\">Deposit payment<\/h2><\/div>\n    ${pr?`<div class=\"tw\"><table><thead><tr><th>Payment Reference<\/th><th>Payment Date<\/th><th>Payment Method<\/th><th class=\"r\">Amount<\/th><th>Status<\/th><\/tr><\/thead><tbody><tr><td class=\"num\">${esc(pr.ref||'—')}<\/td><td class=\"num\">${fd(pr.date)}<\/td><td>${esc(pr.method)}<\/td><td class=\"r num\">${usd(pr.amount)}<\/td><td><span class=\"st ok\">Successful<\/span><\/td><\/tr><\/tbody><\/table><\/div>`\n      :`<div class=\"empty\" style=\"padding:24px\">${s==='Declined'?'No deposit was paid.':'Not paid yet.'}<\/div>`}<\/section>`:''}`;\n}\n\n/* ---- deposit payment (approve + pay, or pay a deposit that is still due) ---- */\nfunction depDlg(){\n  const e=S.ests.find(x=>x.no===P.no), c=estCalc(e), d=c.dep, approve=P.approve;\n  const step=(n,l)=>`<span class=\"${P.step===n?'on':P.step>n?'done':''}\"><i>${P.step>n?'✓':n}<\/i>${l}<\/span>`;\n  const head=`<div class=\"steps\">${step(1,'Payment method')}<span style=\"color:var(--line-2)\">—<\/span>${step(2,'Review')}<span style=\"color:var(--line-2)\">—<\/span>${step(3,'Result')}<\/div>`;\n  const sums=`<div class=\"sumr\"><span>Estimate<\/span><b>${e.no}${e.bk?' · booking '+e.bk:''}<\/b><\/div><div class=\"sumr\"><span>Estimate total<\/span><b class=\"num\">${usd(c.total)}<\/b><\/div>\n    <div class=\"sumr\"><span>${depLbl(e)} to pay now<\/span><b class=\"num\" style=\"color:var(--blue)\">${usd(d)}<\/b><\/div><div class=\"sumr\" style=\"border-bottom:0\"><span>Billed later on invoices<\/span><b class=\"num\">${usd(r2(c.total-d))}<\/b><\/div>`;\n  let body='', foot='';\n  if(P.step===1){\n    body=`${head}${approve?`<div class=\"note\" style=\"margin-bottom:14px\">Paying the deposit ${e.depReq?'is required to approve':'approves'} estimate ${e.no}${e.bk?` and confirms booking ${e.bk}`:''}.<\/div>`:''}${sums}\n      <div class=\"fld\" style=\"margin:14px 0 8px\"><span>Pay with<\/span><\/div>\n      ${S.pms.length?`<div class=\"pm\" role=\"radiogroup\" aria-label=\"Payment method\">${S.pms.map(p=>{ const ex=pmExpired(p); return `<label class=\"${P.m===p.id?'on':''} ${ex?'dis':''}\"><input type=\"radio\" name=\"pm\" value=\"${p.id}\" ${P.m===p.id?'checked':''} ${ex?'disabled':''} data-pm=\"${p.id}\"><span><b>${esc(pmLabel(p))}${p.def&&!ex?' · Default':''}<\/b><small>${esc(pmSub(p))}<\/small><\/span><\/label>`; }).join('')}<\/div>`:`<div class=\"note w\">You have no payment methods yet.<\/div>`}\n      <p class=\"sub\" style=\"margin-top:12px\"><button class=\"lnk\" data-act=\"payAddPm\">+ Add a payment method<\/button><\/p>`;\n    foot=`<button class=\"btn ghost\" data-act=\"close\">Cancel<\/button>${approve&&!e.depReq?`<button class=\"btn sec\" data-act=\"depLater\">Approve, pay later<\/button>`:''}<button class=\"btn pri\" data-act=\"depNext\" ${P.m?'':'disabled'}>Review payment<\/button>`;\n  } else if(P.step===2){\n    const m=S.pms.find(x=>x.id===P.m);\n    body=`${head}<div class=\"note\">Please review before confirming.${approve?` This approves estimate ${e.no}.`:''}<\/div>${sums.replace('style=\"border-bottom:0\"','')}<div class=\"sumr\" style=\"border-bottom:0\"><span>Payment method<\/span><b>${esc(pmLabel(m))}<\/b><\/div>`;\n    foot=`<button class=\"btn ghost\" data-act=\"depBack\">Back<\/button><button class=\"btn pri\" data-act=\"depGo\">Pay ${usd(d)}${approve?' and Approve':''}<\/button>`;\n  } else {\n    const r=e.depPay;\n    body=`${head}<div class=\"res\"><div class=\"ic ok\">✓<\/div><h4>Deposit paid${approve?' · estimate approved':''}<\/h4><p class=\"sub\" style=\"font-size:14.5px\">${usd(r.amount)} paid for estimate ${e.no} with ${esc(r.method)}.<\/p><p class=\"sub\" style=\"font-size:14.5px\">Reference <b>${r.ref}<\/b>${e.bk?` · Booking ${e.bk} ${pill(BK_CLS,(S.bks.find(x=>x.no===e.bk)||{}).status||'Confirmed')}`:''}<\/p><p class=\"sub\" style=\"font-size:13.5px\">${esc(BILLER.name)} sees this payment in GuardsPro.<\/p><\/div>`;\n    foot=`<button class=\"btn pri\" data-act=\"close\">Done<\/button>`;\n  }\n  modal(approve?'Approve and Pay Deposit':'Pay Deposit', body, foot);\n}\n/* write the approval / deposit to the estimate and booking, in the Backoffice format */\nfunction estApprove(e){\n  e.status='Approved'; estLogAdd(e,`Estimate approved by ${CLIENT.user}`);\n  const b=e.bk&&S.bks.find(x=>x.no===e.bk); if(b){ b.status='Confirmed'; bkLogAdd(b,`Estimate ${e.no} approved by ${CLIENT.user}`); linkBk(b); }\n  linkEst(e);\n}\nfunction depPay(e, m){\n  const d=depOf(e), rec={ref:'PAY-'+(refN++), date:TODAY, method:pmLabel(m), amount:d};\n  e.depPay=rec; e.depPaid=TODAY; estLogAdd(e,`Deposit of ${usd(d)} paid online by ${CLIENT.user} · ${rec.method} · ${rec.ref}`);\n  const b=e.bk&&S.bks.find(x=>x.no===e.bk); if(b){ bkLogAdd(b,`Deposit of ${usd(d)} for estimate ${e.no} paid by ${CLIENT.user}`); linkBk(b); }\n  linkEst(e);\n}\n\n/* ======================= 3. INVOICES ======================= */\nfunction vInvoices(){\n  const all = S.invs.map(i=>({i, c:calc(i), s:invStatus(i)}));\n  const sum = a => r2(a.reduce((x,y)=>x+y.c.bal,0));\n  const pend = all.filter(x=>x.s==='Pending'), auto = pend.filter(x=>autoPending(x.i)), unp = all.filter(x=>x.s==='Unpaid'), paid = all.filter(x=>x.s==='Paid');\n  const KI = {\n    pend:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg>',\n    unp:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7.5v5.5M12 16.5h.01\"/><\/svg>',\n    pd:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"m8 12.5 2.7 2.7L16 9.8\"/><\/svg>'};\n  const kp = (k,st,val,n,sub) => `<button type=\"button\" class=\"card ik ${k} ${S.f.ist===st?'on':''}\" data-act=\"kpiF\" data-st=\"${st}\" aria-pressed=\"${S.f.ist===st}\" title=\"Show ${st.toLowerCase()} invoices\">\n    <span class=\"ikh\"><span class=\"ico\">${KI[k]}<\/span><span class=\"lbl\">${st}<\/span><span class=\"cnt\">${n} ${n===1?'invoice':'invoices'}<\/span><\/span>\n    <b class=\"num\">${val}<\/b><span class=\"s\">${sub}<\/span><\/button>`;\n  const q=S.f.iq.trim().toLowerCase();\n  let rows = all.slice().sort((a,b)=>b.i.date.localeCompare(a.i.date)||(+b.i.no - +a.i.no));\n  if(q) rows = rows.filter(x=>x.i.no.includes(q)||x.i.covers.toLowerCase().includes(q)||x.i.lines.some(l=>l.site.toLowerCase().includes(q))||x.i.covers.toLowerCase().includes(q));\n  if(S.f.ist) rows = rows.filter(x=>x.s===S.f.ist);\n  return `${crumbs(['Invoices'])}\n  <div class=\"ph\"><div><h1>Invoices<\/h1><span class=\"sub\">Invoices issued to ${esc(CLIENT.name)} by ${esc(BILLER.name)}<\/span><\/div><\/div>\n  <div class=\"cards c3\">\n    ${kp('pend','Pending',usd(sum(pend)),pend.length,auto.length?`Not yet due · ${auto.length} set to auto charge`:'Not yet due')}\n    ${kp('unp','Unpaid',usd(sum(unp)),unp.length,'Past due or auto charge failed')}\n    ${kp('pd','Paid',usd(r2(paid.reduce((a,x)=>a+x.c.total,0))),paid.length,'Paid in full')}\n<\/div>\n  <div class=\"toolbar\">${searchFld('iq','Invoice number or post site')}${selFld('ist','Status',Object.keys(INV_CLS))}${clearBtn(['iq','ist'])}<\/div>\n  <div class=\"card\"><div class=\"tw\"><table><thead><tr><th>Invoice Number<\/th><th>Billing Period<\/th><th>Invoice Date<\/th><th>Due Date<\/th><th class=\"r\">Amount<\/th><th class=\"r\">Balance Due<\/th><th>Payment<\/th><th>Status<\/th><th class=\"r\">Actions<\/th><\/tr><\/thead><tbody>\n  ${rows.map(({i,c,s})=>`<tr class=\"click\" data-act=\"invOpen\" data-no=\"${i.no}\"><td class=\"num\"><button class=\"lnk\" data-act=\"invOpen\" data-no=\"${i.no}\">${i.no}<\/button><span class=\"sub\" style=\"max-width:170px;white-space:normal\">${esc(i.covers)}<\/span><\/td>\n    <td class=\"num\">${i.p?perShort(i.p):'<span style=\"color:var(--muted)\">—<\/span>'}<\/td><td class=\"num\">${fd(i.date)}<\/td><td class=\"num\">${fd(i.due)}<\/td><td class=\"r num\">${usd(c.total)}<\/td><td class=\"r num\"><b>${usd(c.bal)}<\/b><\/td>\n    <td>${payCell(i,s)}<\/td><td>${pill(INV_CLS,s)}<\/td>\n    <td class=\"r\"><div class=\"acts\"><button class=\"iconbtn\" data-act=\"invDl\" data-no=\"${i.no}\" aria-label=\"Download invoice ${i.no}\" title=\"Download\">${I.dl}<\/button>\n      <button class=\"iconbtn\" data-act=\"pay\" data-no=\"${i.no}\" aria-label=\"Make payment for invoice ${i.no}\" title=\"${canPay(i)?'Make Payment':s==='Paid'?'Paid in full':'Will be auto charged'}\" ${canPay(i)?'':'disabled'}>${I.pay}<\/button><\/div><\/td><\/tr>`).join('')\n    || emptyRow(9,'No invoices found','Change the search or filters.')}\n  <\/tbody><\/table><\/div><\/div>`;\n}\nfunction payCell(i,s){\n  if(s==='Paid'){ const p=paidOn(i); return `<span class=\"paycell\">Paid ${fd(p.date)}${p.auto?' · auto':''}<\/span>`; }\n  if(autoPending(i)) return `<span class=\"paycell auto\">Auto charge ${fd(i.due)}<\/span>`;\n  if(failedAuto(i)) return `<span class=\"paycell fail\">Auto charge failed<\/span>`;\n  return `<span class=\"paycell\">${i.auto&&!defPM()?'Manual (no default method)':'Manual payment'}<\/span>`;\n}\nfunction vInvoice(){\n  const inv=S.invs.find(i=>i.no===S.sel); if(!inv){ S.route='invoices'; return vInvoices(); }\n  const c=calc(inv), s=invStatus(inv), pays=S.pays.filter(p=>p.no===inv.no).sort((a,b)=>b.date.localeCompare(a.date)), fa=failedAuto(inv), dm=defPM();\n  const hrs = inv.lines.filter(l=>l.unit==='hour').reduce((a,l)=>a+l.qty,0), visits = inv.lines.filter(l=>l.unit==='visit').reduce((a,l)=>a+l.qty,0);\n  const banner = s==='Paid' ? `<div class=\"note\" style=\"background:var(--good-bg);color:#0d5e44\"><b>Paid in full.<\/b> Thank you.<\/div>`\n    : fa ? `<div class=\"note e\"><b>Auto charge failed on ${fd(fa.date)}.<\/b> ${esc(fa.method)}: ${esc(fa.why)}. Please pay this invoice manually.<\/div>`\n    : s==='Unpaid' ? `<div class=\"note e\"><b>Unpaid.<\/b> Payment of ${usd(c.bal)} was due on ${fd(inv.due)}.<\/div>`\n    : autoPending(inv) ? `<div class=\"note\"><b>Auto charge is on.<\/b> ${usd(c.bal)} will be charged to ${esc(pmLabel(dm))} on ${fd(inv.due)}. <button class=\"lnk\" data-act=\"go\" data-r=\"methods\">Change default method<\/button><\/div>`\n    : inv.auto ? `<div class=\"note w\"><b>Auto charge is on for this invoice, but you have no valid default payment method.<\/b> Add one in Payment Methods or pay manually.<\/div>` : '';\n  const payTxt = s==='Paid' ? `Paid ${fd(paidOn(inv).date)}` : autoPending(inv) ? `Auto charge on ${fd(inv.due)}<span class=\"sub\">${esc(pmLabel(dm))}<\/span>` : inv.auto ? 'Auto charge (needs manual payment)' : 'Manual payment';\n  return `${crumbs(['Invoices','invoices'],[`Invoice ${inv.no}`])}\n  <div class=\"ph\"><button class=\"iconbtn\" data-act=\"go\" data-r=\"invoices\" aria-label=\"Back to invoices\">${I.back}<\/button><h1>Invoice ${inv.no}<\/h1>${pill(INV_CLS,s)}<span class=\"sp\"><\/span>\n    <button class=\"btn sec\" data-act=\"invDl\" data-no=\"${inv.no}\">${I.dl}Download Invoice<\/button>${canPay(inv)?`<button class=\"btn pri\" data-act=\"pay\" data-no=\"${inv.no}\">${I.pay}Make Payment<\/button>`:''}<\/div>\n  ${banner}\n  <div class=\"dgrid\">\n    <section class=\"card sec\"><h2>Invoice Information<\/h2><dl class=\"dl\">\n      <div><dt>Invoice Number<\/dt><dd>${inv.no}<\/dd><\/div><div><dt>Invoice Date<\/dt><dd>${fd(inv.date)}<\/dd><\/div><div><dt>Due Date<\/dt><dd>${fd(inv.due)}<\/dd><\/div>\n      <div><dt>Billing Period<\/dt><dd>${inv.p?per(inv.p):'—'}<\/dd><\/div><div><dt>Payment Terms<\/dt><dd>${esc(inv.terms)}<\/dd><\/div><div><dt>Payment<\/dt><dd>${payTxt}<\/dd><\/div>\n      <div><dt>Billed To<\/dt><dd>${esc(CLIENT.name)}<span class=\"sub\">${esc(CLIENT.addr)}<\/span><\/dd><\/div><div><dt>Billed By<\/dt><dd>${esc(BILLER.name)}<span class=\"sub\">${esc(BILLER.email)}<\/span><\/dd><\/div>\n      <div><dt>${inv.src==='auto'?'Covers':'Summary'}<\/dt><dd>${esc(inv.covers)}${inv.src==='auto'?'<span class=\"sub\">From approved GuardsPro timesheets<\/span>':''}<\/dd><\/div><\/dl><\/section>\n    <section class=\"card sec\"><h2>Financial Summary<\/h2>\n      <div class=\"sumr\"><span>Subtotal<\/span><b class=\"num\">${usd(c.sub)}<\/b><\/div>\n      <div class=\"sumr\"><span>Tax<\/span><b class=\"num\">${c.tax?usd(c.tax):'No tax'}<\/b><\/div>\n      <div class=\"sumr big\"><span style=\"color:var(--fg)\">Total Amount<\/span><b class=\"num\">${usd(c.total)}<\/b><\/div>\n      <div class=\"sumr\"><span>Amount Paid<\/span><b class=\"num\">${usd(c.paid)}<\/b><\/div>\n      <div class=\"sumr due ${c.bal?'':'zero'}\"><span>Balance Due<\/span><b class=\"num\">${usd(c.bal)}<\/b><\/div>\n      ${canPay(inv)?`<button class=\"btn pri\" style=\"width:100%;justify-content:center;margin-top:14px\" data-act=\"pay\" data-no=\"${inv.no}\">${I.pay}Pay ${usd(c.bal)}<\/button>`:''}\n      <p class=\"sub\" style=\"margin-top:14px\">Questions about this invoice? Contact ${esc(BILLER.email)}.<\/p><\/section><\/div>\n  <div style=\"display:flex;flex-direction:column;gap:24px;margin-top:24px\">\n    <section class=\"card\"><div class=\"sec\" style=\"padding-bottom:6px\"><h2 style=\"margin:0\">Billing Details<\/h2><span class=\"sub\">${[hrs?`${hrs} hours`:'',visits?`${visits} patrol visits`:''].filter(Boolean).join(' · ')}<\/span><\/div><div class=\"tw\"><table><thead><tr><th>Post Site<\/th><th>Service<\/th><th class=\"r\">Qty<\/th><th class=\"r\">Rate<\/th><th class=\"r\">Amount<\/th><\/tr><\/thead><tbody>\n      ${inv.lines.map(l=>`<tr><td>${esc(l.site)}<\/td><td>${esc(l.name)}${l.note?`<span class=\"sub\">${esc(l.note)}<\/span>`:''}<\/td><td class=\"r num\">${l.qty}<span class=\"sub\">${l.unit==='hour'?'hours':l.unit+'s'}<\/span><\/td><td class=\"r num\">${usd(l.rate)}<span class=\"sub\">${unitTxt(l.unit)}<\/span><\/td><td class=\"r num\">${usd(lineAmt(l))}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div><\/section>\n    <section class=\"card\"><div class=\"sec\" style=\"padding-bottom:6px\"><h2 style=\"margin:0\">Payments on this invoice<\/h2><\/div>\n      ${pays.length?`<div class=\"tw\"><table><thead><tr><th>Payment Reference<\/th><th>Payment Date<\/th><th>Payment Method<\/th><th class=\"r\">Amount<\/th><th>Status<\/th><\/tr><\/thead><tbody>${pays.map(p=>`<tr><td class=\"num\">${p.ref}<\/td><td class=\"num\">${fd(p.date)}<\/td><td>${esc(p.method)}${p.auto?'<span class=\"sub\">Auto charge<\/span>':''}<\/td><td class=\"r num\">${usd(p.amount)}<\/td><td>${p.ok?'<span class=\"st ok\">Successful<\/span>':`<span class=\"st fail\">Failed<\/span><span class=\"sub\">${esc(p.why||'')}<\/span>`}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>`:`<div class=\"empty\" style=\"padding:24px\">No payments yet.<\/div>`}<\/section>\n  <\/div>`;\n}\n\n\n/* ======================= 4. PAYMENT METHODS ======================= */\nfunction vMethods(){\n  const dm=defPM(), up=S.invs.filter(autoPending), upAmt=r2(up.reduce((a,i)=>a+calc(i).bal,0));\n  const note = dm ? `<div class=\"note\"><b>Auto charge.<\/b> Invoices that ${esc(BILLER.name)} sets to auto charge are charged to your default payment method, <b>${esc(pmLabel(dm))}<\/b>, on the due date.${up.length?` ${up.length} upcoming ${up.length===1?'charge':'charges'} · ${usd(upAmt)}.`:''} Invoices without auto charge can be paid manually from Invoices.<\/div>`\n    : `<div class=\"note w\"><b>No default payment method.<\/b> Auto charge cannot run, so invoices set to auto charge must be paid manually. Add a payment method or set one as default.<\/div>`;\n  return `${crumbs(['Payment Methods'])}\n  <div class=\"ph\"><div><h1>Payment Methods<\/h1><span class=\"sub\">Cards and bank accounts used to pay your invoices<\/span><\/div><span class=\"sp\"><\/span><button class=\"btn pri\" data-act=\"pmAdd\">${I.plus}Add Payment Method<\/button><\/div>\n  ${note}\n  ${S.pms.length?`<div class=\"pmgrid\">${S.pms.map(p=>{ const ex=pmExpired(p); return `<article class=\"card pmcard ${p.def&&!ex?'def':''}\" data-act=\"pmOpen\" data-id=\"${p.id}\" role=\"button\" tabindex=\"0\" aria-label=\"View ${esc(pmLabel(p))}\">\n    <div class=\"pmtop\">${brandBox(p)}<div style=\"flex:1;min-width:0\"><b>${esc(pmLabel(p))}<\/b><small>${esc(pmSub(p))}<\/small><\/div>${p.def&&!ex?'<span class=\"tag def\">Default<\/span>':''}${ex?'<span class=\"tag exp\">Expired<\/span>':''}<\/div>\n    <div class=\"sub\" style=\"margin:0\">${p.kind==='card'?'Name on card':'Account holder'}: ${esc(p.name)}<\/div>\n    <div class=\"pmacts\">${!p.def&&!ex?`<button class=\"btn sec sm\" data-act=\"pmDef\" data-id=\"${p.id}\">Set as default<\/button>`:''}${p.def&&!ex?'<span class=\"hint\" style=\"align-self:center;flex:1\">Used for auto charge<\/span>':''}${ex?'<span class=\"hint\" style=\"align-self:center;flex:1\">Cannot be charged. Remove it and add a new card.<\/span>':''}<button class=\"btn ghost sm\" data-act=\"pmDel\" data-id=\"${p.id}\">Remove<\/button><\/div><\/article>`; }).join('')}<\/div>`\n    : `<div class=\"card empty\"><b>No payment methods<\/b>Add a card or bank account to pay invoices and allow auto charge.<\/div>`}\n  <p class=\"sub\" style=\"margin-top:18px\">Payment details are stored by the payment processor. GuardsPro only shows the last four digits.<\/p>`;\n}\n\n/* ======================= dialogs ======================= */\nlet P=null, CF=null, AM=null;\nfunction modal(title,body,foot,cls=''){ document.getElementById('layer').innerHTML = `<div class=\"ov\" data-act=\"bg\"><div class=\"modal ${cls}\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${esc(title)}\"><div class=\"mh\"><h3>${title}<\/h3><button class=\"iconbtn\" data-act=\"close\" aria-label=\"Close\" style=\"border:0\">${I.x}<\/button><\/div><div class=\"mb\">${body}<\/div><div class=\"mf\">${foot}<\/div><\/div><\/div>`; }\nfunction confirmDlg(title,body,label,fn){ CF=fn; modal(title,body,`<button class=\"btn ghost\" data-act=\"close\">Cancel<\/button><button class=\"btn pri\" data-act=\"cfGo\">${label}<\/button>`); }\nfunction closeLayer(){ document.getElementById('layer').innerHTML=''; P=null; CF=null; AM=null; }\n\n/* ---- pay ---- */\nfunction payDlg(){\n  if(P && P.kind==='dep') return depDlg();\n  const inv=S.invs.find(i=>i.no===P.no), c=calc(inv);\n  const step=(n,l)=>`<span class=\"${P.step===n?'on':P.step>n?'done':''}\"><i>${P.step>n?'✓':n}<\/i>${l}<\/span>`;\n  const head=`<div class=\"steps\">${step(1,'Payment method')}<span style=\"color:var(--line-2)\">—<\/span>${step(2,'Review')}<span style=\"color:var(--line-2)\">—<\/span>${step(3,'Result')}<\/div>`;\n  let body='', foot='';\n  if(P.step===1){\n    body=`${head}<div class=\"sumr\"><span>Invoice<\/span><b>${inv.no}${inv.p?' · '+perShort(inv.p):''}<\/b><\/div><div class=\"sumr\"><span>Due date<\/span><b>${fd(inv.due)}<\/b><\/div><div class=\"sumr\" style=\"border-bottom:0\"><span>Amount to pay<\/span><b class=\"num\" style=\"color:var(--bad)\">${usd(c.bal)}<\/b><\/div>\n      <div class=\"fld\" style=\"margin:14px 0 8px\"><span>Pay with<\/span><\/div>\n      ${S.pms.length?`<div class=\"pm\" role=\"radiogroup\" aria-label=\"Payment method\">${S.pms.map(p=>{ const ex=pmExpired(p); return `<label class=\"${P.m===p.id?'on':''} ${ex?'dis':''}\"><input type=\"radio\" name=\"pm\" value=\"${p.id}\" ${P.m===p.id?'checked':''} ${ex?'disabled':''} data-pm=\"${p.id}\"><span><b>${esc(pmLabel(p))}${p.def&&!ex?' · Default':''}<\/b><small>${esc(pmSub(p))}<\/small><\/span><\/label>`; }).join('')}<\/div>`:`<div class=\"note w\">You have no payment methods yet.<\/div>`}\n      <p class=\"sub\" style=\"margin-top:12px\"><button class=\"lnk\" data-act=\"payAddPm\">+ Add a payment method<\/button><\/p>`;\n    foot=`<button class=\"btn ghost\" data-act=\"close\">Cancel<\/button><button class=\"btn pri\" data-act=\"payNext\" ${P.m?'':'disabled'}>Review payment<\/button>`;\n  } else if(P.step===2){\n    const m=S.pms.find(x=>x.id===P.m);\n    body=`${head}<div class=\"note\">Please review before confirming.<\/div><div class=\"sumr\"><span>Invoice<\/span><b>${inv.no}<\/b><\/div><div class=\"sumr\"><span>Payment method<\/span><b>${esc(pmLabel(m))}<\/b><\/div><div class=\"sumr\"><span>Amount<\/span><b class=\"num\">${usd(c.bal)}<\/b><\/div><div class=\"sumr\" style=\"border-bottom:0\"><span>Balance after payment<\/span><b class=\"num\">${usd(0)}<\/b><\/div>`;\n    foot=`<button class=\"btn ghost\" data-act=\"payBack\">Back<\/button><button class=\"btn pri\" data-act=\"payGo\">Pay ${usd(c.bal)}<\/button>`;\n  } else {\n    const r=P.result;\n    body=`${head}<div class=\"res\"><div class=\"ic ok\">✓<\/div><h4>Payment successful<\/h4><p class=\"sub\" style=\"font-size:14.5px\">${usd(r.amount)} paid on invoice ${inv.no} with ${esc(r.method)}.<\/p><p class=\"sub\" style=\"font-size:14.5px\">Reference <b>${r.ref}<\/b> · Status: ${pill(INV_CLS,invStatus(inv))}<\/p><\/div>`;\n    foot=`<button class=\"btn pri\" data-act=\"close\">Done<\/button>`;\n  }\n  modal('Make Payment', body, foot);\n}\n\n/* ---- add payment method ---- */\n/* ---- add payment method (United States) ----\n   Card: name, number (Luhn check; Visa, Mastercard, American Express, Discover), expiry, CVV (4 digits for Amex)\n         and billing ZIP code, which US card issuers check.\n   Bank: ACH debit from a checking or savings account (routing number with ABA checksum), with the client's\n         ACH debit authorization. */\nconst AM_TYPES = ['Checking','Savings'];\nconst blankAM = () => ({kind:'card', f:{name:'', num:'', exp:'', cvc:'', zip:'', holder:CLIENT.name, bank:'', routing:'', acct:'', acct2:'', type:'Checking', auth:false, def:!defPM()}, err:{}, back:null});\nconst cardBrand = n => /^4/.test(n)?'Visa':/^(5[1-5]|2[2-7])/.test(n)?'Mastercard':/^3[47]/.test(n)?'Amex':/^(6011|65|64[4-9])/.test(n)?'Discover':'';\nconst luhn = n => { let sum=0, alt=false; for(let i=n.length-1;i>=0;i--){ let d=+n[i]; if(alt){ d*=2; if(d>9) d-=9; } sum+=d; alt=!alt; } return sum%10===0; };\nconst abaOk = r => /^\\d{9}$/.test(r) && (3*(+r[0]+ +r[3]+ +r[6]) + 7*(+r[1]+ +r[4]+ +r[7]) + (+r[2]+ +r[5]+ +r[8]))%10===0;\nfunction amDlg(){\n  const a=AM, f=a.f, e=a.err;\n  const fld=(k,l,attrs='',cls='',hint='')=>`<div class=\"fld ${cls}\"><label for=\"am-${k}\">${l} <i class=\"req\">*<\/i><\/label><input id=\"am-${k}\" data-am=\"${k}\" value=\"${esc(f[k])}\" ${attrs} class=\"${e[k]?'bad':''}\">${ferr(e,k)}${hint&&(k==='num'||!e[k])?`<span class=\"hint\">${hint}<\/span>`:''}<\/div>`;\n  const brand=cardBrand(f.num.replace(/\\D/g,''));\n  const card = `${fld('name','Name on card','autocomplete=\"cc-name\"','span2')}\n      ${fld('num','Card number','inputmode=\"numeric\" autocomplete=\"cc-number\" placeholder=\"1234 5678 9012 3456\" maxlength=\"23\"','span2', brand?`${brand==='Amex'?'American Express':brand} · we accept Visa, Mastercard, American Express and Discover`:'We accept Visa, Mastercard, American Express and Discover')}\n      ${fld('exp','Expiration date (MM/YY)','inputmode=\"numeric\" placeholder=\"MM/YY\" maxlength=\"5\" autocomplete=\"cc-exp\"')}\n      ${fld('cvc',brand==='Amex'?'Security code (CID)':'Security code (CVV)',`inputmode=\"numeric\" maxlength=\"4\" autocomplete=\"cc-csc\" type=\"password\" placeholder=\"${brand==='Amex'?'4 digits on the front':brand?'3 digits on the back':'3 or 4 digits'}\"`)}\n      ${fld('zip','Billing ZIP code','inputmode=\"numeric\" maxlength=\"10\" autocomplete=\"postal-code\" placeholder=\"e.g. 19107\"','span2')}`;\n  const bank = `${fld('holder','Account holder name','','span2')}${fld('bank','Bank name','','span2','e.g. Chase, Bank of America, Wells Fargo')}\n      <div class=\"fld span2\"><label for=\"am-type\">Account type <i class=\"req\">*<\/i><\/label><select id=\"am-type\" data-am=\"type\">${AM_TYPES.map(o=>`<option ${f.type===o?'selected':''}>${o}<\/option>`).join('')}<\/select><\/div>\n      ${fld('routing','Routing number','inputmode=\"numeric\" maxlength=\"9\" placeholder=\"9 digits, e.g. 021000021\"','span2','The 9-digit ABA number at the bottom left of a check')}\n      ${fld('acct','Account number','inputmode=\"numeric\" maxlength=\"17\" autocomplete=\"off\"')}${fld('acct2','Confirm account number','inputmode=\"numeric\" maxlength=\"17\" autocomplete=\"off\"')}\n      <label class=\"chk span2 ${e.auth?'bad':''}\" style=\"align-items:flex-start;line-height:1.45\"><input type=\"checkbox\" data-am=\"auth\" ${f.auth?'checked':''} style=\"width:16px;height:16px;margin-top:2px;accent-color:var(--blue);flex:none\"> <span>I authorize ${esc(BILLER.name)} to debit this account by ACH for invoices and deposits I pay, and for invoices set to auto charge. I can revoke this authorization by removing the account.<\/span><\/label>${ferr(e,'auth')}`;\n  const body = `<div class=\"seg\" role=\"tablist\"><button role=\"tab\" class=\"${a.kind==='card'?'on':''}\" aria-selected=\"${a.kind==='card'}\" data-act=\"amKind\" data-v=\"card\">Credit or debit card<\/button><button role=\"tab\" class=\"${a.kind==='bank'?'on':''}\" aria-selected=\"${a.kind==='bank'}\" data-act=\"amKind\" data-v=\"bank\">Bank account (ACH)<\/button><\/div>\n    <div class=\"fgrid\">${a.kind==='card'?card:bank}\n      <label class=\"chk span2\"><input type=\"checkbox\" data-am=\"def\" ${f.def?'checked':''} style=\"width:16px;height:16px;accent-color:var(--blue)\"> Set as default payment method for auto charge<\/label><\/div>\n    <p class=\"sub\" style=\"margin-top:14px\">Prototype only: details are not stored or sent anywhere.<\/p>`;\n  modal('Add Payment Method', body, `<button class=\"btn ghost\" data-act=\"${a.back?'amBack':'close'}\">Cancel<\/button><button class=\"btn pri\" data-act=\"amSave\">Save Payment Method<\/button>`);\n}\nfunction amSave(){\n  const a=AM, f=a.f, e={}, dig=s=>s.replace(/\\D/g,'');\n  if(a.kind==='card'){\n    if(!f.name.trim()) e.name='Enter the name on the card.';\n    const n=dig(f.num), br=cardBrand(n);\n    if(!br) e.num='Enter a Visa, Mastercard, American Express or Discover card number.';\n    else if(n.length!==(br==='Amex'?15:16) || !luhn(n)) e.num='This card number is not valid. Check the digits.';\n    const m=/^(\\d{2})\\/(\\d{2})$/.exec(f.exp.trim()); if(!m || +m[1]<1 || +m[1]>12) e.exp='Use the format MM/YY.'; else if(`20${m[2]}-${m[1]}` < TODAY.slice(0,7)) e.exp='This card has expired.';\n    if(!new RegExp(`^\\\\d{${br==='Amex'?4:3}}$`).test(f.cvc.trim())) e.cvc=`Enter the ${br==='Amex'?'4':'3'}-digit security code.`;\n    if(!/^\\d{5}(-\\d{4})?$/.test(f.zip.trim())) e.zip='Enter a 5-digit ZIP code (or ZIP+4).';\n  } else {\n    if(!f.holder.trim()) e.holder='Enter the account holder name.';\n    if(!f.bank.trim()) e.bank='Enter the bank name.';\n    if(!abaOk(f.routing.trim())) e.routing='Enter a valid 9-digit routing number.';\n    const ac=dig(f.acct); if(!/^\\d{4,17}$/.test(ac)) e.acct='Enter the account number (4 to 17 digits).';\n    else if(dig(f.acct2)!==ac) e.acct2='The account numbers do not match.';\n    if(!f.auth) e.auth='Accept the ACH debit authorization to add this account.';\n  }\n  a.err=e; if(Object.keys(e).length){ amDlg(); document.querySelector('.modal .bad')?.focus(); return; }\n  const id='pm'+(pmN++); let p;\n  if(a.kind==='card'){ const n=dig(f.num), m=f.exp.split('/'); p={id, kind:'card', brand:cardBrand(n), last4:n.slice(-4), exp:`20${m[1]}-${m[0]}`, zip:f.zip.trim(), name:f.name.trim(), def:false}; }\n  else p={id, kind:'bank', bank:f.bank.trim(), type:f.type, last4:dig(f.acct).slice(-4), routing:f.routing.trim(), authOn:TODAY, name:f.holder.trim(), def:false};\n  S.pms.push(p); if(f.def || !defPM()) S.pms.forEach(x=>x.def = x.id===id);\n  const back=a.back; AM=null;\n  if(back){ P=back; P.m=id; payDlg(); } else { closeLayer(); render(); }\n  snack(`${pmLabel(p)} added${p.def?' and set as default':''}`);\n}\n\n/* ---- payment method details ---- */\nfunction pmDlg(id){\n  const p=S.pms.find(x=>x.id===id); if(!p) return closeLayer();\n  const ex=pmExpired(p), isDef=p.def&&!ex, used=S.pays.filter(x=>x.method===pmLabel(p)).sort((a,b)=>b.date.localeCompare(a.date)), up=isDef?S.invs.filter(autoPending):[];\n  const row=(k,v)=>`<div class=\"sumr\"><span>${k}<\/span><b>${v}<\/b><\/div>`;\n  const body=`<div class=\"pmtop\" style=\"margin-bottom:14px\">${brandBox(p)}<div style=\"flex:1;min-width:0\"><b>${esc(pmLabel(p))}<\/b><small>${esc(p.kind==='card'?'Credit or debit card':'Bank account · ACH debit')}<\/small><\/div>${isDef?'<span class=\"tag def\">Default<\/span>':''}${ex?'<span class=\"tag exp\">Expired<\/span>':''}<\/div>\n    ${p.kind==='card'?row('Name on card',esc(p.name))+row(ex?'Expired':'Expires',`${p.exp.slice(5)}/${p.exp.slice(0,4)}`)+(p.zip?row('Billing ZIP code',esc(p.zip)):''):row('Account holder',esc(p.name))+row('Bank',esc(p.bank))+row('Account type',esc(p.type))+(p.routing?row('Routing number',esc(p.routing)):'')+row('Clearing time','3 to 4 business days')+(p.authOn?row('ACH authorization','Accepted '+fd(p.authOn)):'')}\n    ${row('Auto charge',isDef?'Used for auto charge':ex?'Cannot be charged':'Not used. Set as default to use it')}\n    ${up.length?`<div class=\"note\" style=\"margin:14px 0 0\">${up.length} upcoming auto ${up.length===1?'charge':'charges'}: ${up.map(i=>`invoice ${i.no}, ${usd(calc(i).bal)} on ${fd(i.due)}`).join('; ')}.<\/div>`:''}\n    ${ex?`<div class=\"note w\" style=\"margin:14px 0 0\">This card has expired. Remove it and add a new card in Payment Methods.<\/div>`:''}\n    <div class=\"fld\" style=\"margin-top:18px\"><span>Payments made with this method<\/span><\/div>\n    ${used.length?used.map(x=>`<div class=\"sumr\"><span>${fd(x.date)} · invoice ${x.no}<\/span><b class=\"num\">${usd(x.amount)}<\/b><\/div>`).join(''):'<p class=\"sub\" style=\"margin:6px 0 0\">No payments yet.<\/p>'}`;\n  const foot=`<button class=\"btn ghost\" data-act=\"pmDel\" data-id=\"${p.id}\" style=\"margin-right:auto\">Remove<\/button>${!isDef&&!ex?`<button class=\"btn sec\" data-act=\"pmDef\" data-id=\"${p.id}\">Set as default<\/button>`:''}<button class=\"btn pri\" data-act=\"close\">Done<\/button>`;\n  modal('Payment Method', body, foot);\n}\n\n/* ======================= PDF download ======================= */\nfunction pdfDoc(o){\n  if(!window.jspdf) return snack('PDF library unavailable here.','e');\n  const doc=new window.jspdf.jsPDF({unit:'pt',format:'letter'}); let y=56;\n  doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.setTextColor(47,79,216); doc.text(o.title,48,y);\n  doc.setFontSize(11); doc.setTextColor(30,36,51); doc.text(BILLER.name,564,y-8,{align:'right'}); doc.setFont('helvetica','normal'); doc.text(BILLER.addr,564,y+7,{align:'right'}); doc.text(BILLER.email,564,y+21,{align:'right'});\n  y+=50; doc.setFontSize(10.5);\n  const kv=(k,v,x,yy)=>{ doc.setTextColor(110,115,133); doc.text(k,x,yy); doc.setTextColor(30,36,51); doc.text(String(v),x,yy+14); };\n  o.kv.forEach((p,i)=>{ kv(p[0],p[1],48+(i%4)*130,y+Math.floor(i/4)*40); }); y+=Math.ceil(o.kv.length/4)*40;\n  doc.setTextColor(110,115,133); doc.text('Billed to',48,y); doc.setTextColor(30,36,51); doc.text(CLIENT.name,48,y+14); doc.text(CLIENT.addr,48,y+28);\n  y+=56; doc.setFillColor(246,247,251); doc.rect(48,y-12,516,20,'F'); doc.setFont('helvetica','bold'); doc.text(o.colA,54,y+2); doc.text(o.qty||'Hours',398,y+2,{align:'right'}); doc.text('Rate',470,y+2,{align:'right'}); doc.text('Amount',558,y+2,{align:'right'}); doc.setFont('helvetica','normal');\n  y+=22; o.lines.forEach(l=>{ doc.text(l.a,54,y); doc.setTextColor(110,115,133); doc.text(l.b,54,y+12); doc.setTextColor(30,36,51); doc.text(String(l.h),398,y,{align:'right'}); doc.text(usd(l.r),470,y,{align:'right'}); doc.text(usd(r2(l.h*l.r)),558,y,{align:'right'}); y+=30; });\n  y+=6; doc.setDrawColor(213,217,227); doc.line(330,y,564,y); y+=18;\n  o.totals.forEach(([k,v,b])=>{ doc.setFont('helvetica',b?'bold':'normal'); doc.text(k,340,y); doc.text(v,558,y,{align:'right'}); y+=18; });\n  if(o.note){ y+=14; doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(110,115,133); doc.text(doc.splitTextToSize(o.note,516),48,y); }\n  doc.setFontSize(9); doc.setTextColor(110,115,133); doc.text('Generated by GuardsPro · sample document from the Client Portal prototype',48,760);\n  doc.save(o.file); snack(`${o.file.replace('.pdf','').replace('-',' ')} downloaded`);\n}\nfunction invDl(no){\n  const inv=S.invs.find(i=>i.no===no), c=calc(inv);\n  pdfDoc({title:'INVOICE', file:`Invoice-${no}.pdf`, colA:'Post site / service', qty:'Qty', kv:[['Invoice number',no],['Invoice date',fd(inv.date)],['Due date',fd(inv.due)],['Status',invStatus(inv)],['Billing period',inv.p?per(inv.p):'—'],['Payment terms',inv.terms],['Payment',inv.auto?'Auto charge':'Manual']],\n    lines:inv.lines.map(l=>({a:l.site,b:l.name+(l.note?` · ${l.note}`:''),h:l.qty,r:l.rate})), totals:[['Subtotal',usd(c.sub)],['Tax',c.tax?usd(c.tax):'No tax'],['Total',usd(c.total),1],['Amount paid',usd(c.paid)],['Balance due',usd(c.bal),1]]});\n}\nfunction estDl(no){\n  const e=S.ests.find(x=>x.no===no), c=estCalc(e);\n  pdfDoc({title:'ESTIMATE', file:`Estimate-${no}.pdf`, colA:'Product or service', qty:'Qty', kv:[['Estimate number',no],['Estimate date',fd(e.date)],['Expiry date',fd(e.expire)],['Status',estStatus(e)],['Booking',e.bk||'—'],['Post site',estSite(e)],['PO number',e.po||'—']],\n    lines:e.lines.map(l=>({a:prodOf(l).name,b:prodOf(l).desc,h:l.qty,r:l.rate})), totals:[['Subtotal',usd(c.sub)],['Tax',c.tax?usd(c.tax):'No tax'],...(c.disc?[['Discount','-'+usd(c.disc)]]:[]),['Total',usd(c.total),1]], note:[e.summary,e.notes].filter(Boolean).join(' · ')});\n}\n\n\n/* ======================= actions ======================= */\nfunction snack(msg,k=''){ document.querySelector('.snack')?.remove(); const el=document.createElement('div'); el.className='snack '+k; el.setAttribute('role','status'); el.innerHTML=`<span>${msg}<\/span><button type=\"button\">OK<\/button>`; el.querySelector('button').onclick=()=>el.remove(); document.body.appendChild(el); setTimeout(()=>el.remove(),4000); }\nconst A = {\n  go:el=>go(el.dataset.r),\n  stub:el=>{ const l=el.querySelector?.('span')?.textContent; if(el.classList.contains('nav')) go('stub', l); else snack('This control is part of the existing portal and is not used in this prototype.'); },\n  navInv:()=>{ if(!GROUP[S.route]) go('bookings'); else { S.navOpen=!S.navOpen; renderSide(); } },\n  menu:()=>document.getElementById('side').classList.toggle('open'),\n  kpiF:el=>{ S.f.ist = S.f.ist===el.dataset.st ? '' : el.dataset.st; render(); },\n  fclear:el=>{ el.dataset.k.split(',').forEach(k=>S.f[k]=''); render(); },\n  /* bookings */\n  bkNew:()=>{ S.bf=blankBF(); go('bookingNew'); },\n  bkOpen:el=>go('booking',el.dataset.no),\n  bfAdd:()=>{ S.bf.scheds.push(blankSched()); render(); const c=document.querySelectorAll('.qform section[aria-label^=\"Schedule\"]'); c[c.length-1]?.scrollIntoView({behavior:'smooth',block:'start'}); },\n  bfDel:el=>{ S.bf.scheds.splice(+el.dataset.i,1); render(); },\n  bfSubmit:()=>bfSubmit(),\n  bkCancel:()=>{ const b=S.bks.find(x=>x.no===S.sel); confirmDlg(`Cancel booking ${b.no}?`, `${esc(BILLER.name)} will stop reviewing this request. This cannot be undone.`, 'Cancel Booking', ()=>{ b.status='Cancelled'; bkLogAdd(b,`Booking cancelled by ${CLIENT.user}`); linkBk(b); snack(`Booking ${b.no} cancelled`); }); },\n  /* estimates */\n  estOp tatus='Declined'; delete b.declinedBy; bkLogAdd(b,`Estimate ${e.no} declined by ${CLIENT.user}`); linkBk(b); } snack(`Estimate ${e.no} declined`); }); },\n  /* invoices */\n  invOpen:el=>go('invoice',el.dataset.no),\n  invDl:el=>invDl(el.dataset.no),\n  pay:el=>{ const inv=S.invs.find(i=>i.no===el.dataset.no); if(!canPay(inv)) return snack(invStatus(inv)==='Paid'?'This invoice is paid in full.':'This invoice will be auto charged on the due date.','e'); const d=defPM()||S.pms.find(p=>!pmExpired(p)); P={no:inv.no, step:1, m:d?d.id:null}; payDlg(); },\n  payNext:()=>{ if(!P.m) return; P.step=2; payDlg(); },\n  payBack:()=>{ P.step=1; payDlg(); },\n  payGo:()=>{ const inv=S.invs.find(i=>i.no===P.no), m=S.pms.find(x=>x.id===P.m); const rec={ref:'PAY-'+(refN++), no:P.no, date:TODAY, method:pmLabel(m), amount:calc(inv).bal, ok:true}; S.pays.push(rec); P.result=rec; P.step=3; render(); payDlg(); },\n  payAddPm:()=>{ const back=P; AM=blankAM(); AM.back=back; P=null; amDlg(); },\n  /* payment methods */\n  pmAdd:()=>{ AM=blankAM(); amDlg(); },\n  amKind:el=>{ AM.kind=el.dataset.v; AM.err={}; amDlg(); },\n  amSave:()=>amSave(),\n  amBack:()=>{ P=AM.back; AM=null; payDlg(); },\n  pmOpen:el=>pmDlg(el.dataset.id),\n  pmDef:el=>{ S.pms.forEach(p=>p.def = p.id===el.dataset.id); closeLayer(); render(); snack(`${pmLabel(defPM())} is now your default payment method`); },\n  pmDel:el=>{ const p=S.pms.find(x=>x.id===el.dataset.id), others=S.pms.filter(x=>x!==p && !pmExpired(x));\n    if(p.def && !pmExpired(p) && others.length) return snack('Set another payment method as default before removing this one.','e');\n    const n=S.invs.filter(autoPending).length;\n    confirmDlg(`Remove ${pmLabel(p)}?`, p.def&&!pmExpired(p)&&n ? `This is your default payment method. ${n} ${n===1?'invoice':'invoices'} set to auto charge will need to be paid manually.` : 'You can add it again later.', 'Remove', ()=>{ S.pms=S.pms.filter(x=>x!==p); snack(`${pmLabel(p)} removed`); }); },\n  /* dialogs */\n  cfGo:( =S.bf.scheds[+d.i]; s.guards=t.value; delete s.err.guards; t.classList.remove('bad'); t.parentElement.querySelector('.ferr')?.remove(); return; }\n  if(d.bfd){ const s=S.bf.scheds[+d.i]; s.days = t.checked ? sortDays([...s.days,d.bfd]) : s.days.filter(x=>x!==d.bfd); delete s.err.days; render(); return; }\n  if(d.pm && P){ P.m=d.pm; payDlg(); return; }\n  if(d.am==='def'){ AM.f.def=t.checked; return; }\n  if(d.am==='type'){ AM.f.type=t.value; }\n  if(d.am==='auth'){ AM.f.auth=t.checked; if(AM.err.auth){ delete AM.err.auth; amDlg(); } }\n});\ndocument.addEventListener('keydown', ev=>{ const t=ev.target; if((ev.key==='Enter'||ev.key===' ') && t.matches?.('[role=button][data-act]')){ ev.preventDefault(); A[t.dataset.act]?.(t,ev); return; } if(ev.key==='Escape' && document.getElementById('layer').innerHTML) closeLayer(); });\nreset();\nrender();\n<\/script>\n<\/body>\n<\/html>\n" };
