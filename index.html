<style>

.btn:hover{border-color:var(--blue-2)}

.stage.split .pane .lbl{display:flex}

height:1.35;font-weight:700;color:var(--fg)}\n.ncard .s{margin-top:auto;font-size:12.5px;font-weight:500;color:var(--muted)}\n:root{--orange:#ff9a4a}\n@media (max-width:1100px){.ncards{grid-template-columns:repeat(3,minmax(0,1fr))}}\n@media (max-width:600px){.ncards{grid-template-columns:repeat(2,minmax(0,1fr))}.ncard{padding:16px}.ncard .v{font-size:22px}}\n/* Invoicer › Estimates (existing screen) */\n.es-h{display:flex;align-items:center;gap:14px;margin:-24px calc(-1*max(16px,min(36px,3vw))) 24px calc(-1*max(16px,min(36px,4vw)));padding:18px max(16px,min(36px,3vw)) 18px max(16px,min(36px,4vw));border-bottom:1px solid var(--line)}\n.es-h h1{font-size:18px;font-weight:700}\n.es-h .btn{margin-left:auto}\n.ncards.four{grid-template-columns:repeat(4,minmax(0,1fr))}\n.bk-dl{grid-template-columns:minmax(120px,max-content) 1fr}\n.bk-dl dd > div + div{margin-top:6px}\n.dep{display:grid;gap:12px;margin-top:2px}\n.dep-h{display:flex;align-items:center;justify-content:space-between}\n.dep-h .new{margin-left:6px}\n.new.enh{background:#0f766e;color:#e6fffb}\n.tcard .trow b .new{display:inline-block;margin:0 0 0 6px;vertical-align:middle;font-size:10px;color:#e6fffb}\n.btn .new.enh{margin-left:4px}\n.dep-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}\n.dep-in{display:flex;gap:8px}\n.dep-in input{width:110px}.dep-in select{width:auto}\n.dep-due{display:flex;gap:12px;align-items:baseline}\n.dep-req{align-items:flex-start;line-height:1.45}\n.dep-req input{margin-top:3px}\n.ncards.five{grid-template-columns:repeat(5,minmax(0,1fr))}\n.ncard.on{border-color:var(--accent);background:#131a2c}\n.proto a{color:var(--proto-fg);border:1px solid var(--proto-line);border-radius:6px;padding:3px 8px;background:#1b1608;text-decoration:none}\n.es-tools .btn.ghost svg{width:16px;height:16px}\n.pill-s{border-radius:999px;min-width:280px}\n.ibtn.round{width:44px;height:38px;border-radius:999px;background:#262f4a;color:var(--link)}\n.ibtn.round:not(.on){ba ] of Object.entries(S.setups)){\n    if(c.status==='Off') continue;\n    const failed = S.runs.find(r=>r.client===k && r.result==='Failed' && !r.retried);\n    if(failed) rows.push({k,c,p:failed.p,gen:failed.at,state:runStatus(failed),run:failed.id,retry:true,why:'The run stopped part way. Retry finishes it without billing twice.'});\n    if(c.status==='Paused'){ const miss = nextRuns(c,12).filter(x=>x.gen<=NOW && x.gen.slice(0,10)!==TODAY);\n      if(miss.length) rows.push({k,c,p:[miss[0].s,miss[miss.length-1].e],gen:miss[0].gen,state:'Will be skipped',first:true,paused:true,missed:miss.length,why:`Paused on ${fd(c.pausedOn)}. ${plural(miss.length,'billing period')} missed so far; on resume you choose to invoice or skip them.`}); }\n  }\n  return rows.sort((a,b)=>a.gen.localeCompare(b.gen));\n}\nfunction upcomingRows(perClient=1){\n  const rows = [];\n  for(const [k,c] of Object.entries(S.setups)){\n    if(c.status==='Off') continue;\n    nextRuns(c,perClient+12).filter(x=>x.gen>NOW||x.gen.slice(0,10)===TODAY).slice(0,perClient).forEach((x,i)=>{\n      const state = c.status==='Paused' ? 'Will be skipped' : S.busy[k] ? 'Processing' : x.gen.slice(0,10)<=TODAY ? 'Due today' : 'Scheduled';\n      rows.push({k,c,p:[x.s,x.e],gen:x.gen,state,first:i===0,started:x.s<=TODAY});\n    });\n  }\n  const ord = {'Partially completed':0,'Failed':0,'Due today':1,'Processing':1,'Scheduled':2,'Will be skipped':3};\n  return rows.sort((a,b)=>(ord[a.state]??2)-(ord[b.state]??2) || a.gen.localeCompare(b.gen));\n}\n/* one upcoming run: what it will bill, read-only */\nfunction runView(k, s0, e0, gen){\n  const c = S.setups[k], cl = C(k), p = [s0,e0], per0 = nextRuns(c,24).find(x=>x.s===s0) || {cut:'',gen};\n  const cc = clone(c); cc.policy = 'partial'; const pl = planRun(k,p,'preview',cc);\n  const all = tsInPeriod(k,p), cnt = kind => pl.left.filter(l=>l.kind===kind).length;\n  const tots = pl.plans.map(x=>sumLines(x.lines,taxOf(k))), est = r2(tots.reduce((a,t)=>a+t.total,0));\n  const paused = c.status==='Paused', due = !paused && gen.slice(0,10)<=TODAY, ended = e0 < TODAY;\n  const status = paused ? 'Will be skipped' : S.busy[k] ? 'Processing' : due ? 'Due today' : 'Scheduled';\n  const row = (l,v,sub='') => `<div class=\"rv-r\"><span>${l}<\/span><b>${v}${sub?`<small>${sub}<\/small>`:''}<\/b><\/div>`;\n  const body = `${paused?banner('warn','Invoicing is paused',` Paused on ${fd(c.pausedOn)}${c.pauseWhy?': '+esc(c.pauseWhy):''}. This run is skipped until the client is resumed.`):''}\n    <div class=\"rv-h\"><div><small>Client<\/small><b>${esc(cl.name)}<\/b><\/div>${st(status)}<\/div>\n    <section class=\"rv-s\"><h4>Schedule<\/h4>${row('Billing period',per(p),`${FREQL[c.freq]} · ${ended?'period ended':s0>TODAY?'not started yet':'period in progress'}`)}${row('Timesheet approval cutoff',per0.cut?ft(per0.cut):'—')}${row('Invoice generation',ft(gen))}${row('Approval',APPRL[c.approval],c.approval==='auto'?'Only when every check passes':'Created as Draft for Finance')}<\/section>\n    <section class=\"rv-s\"><h4>Timesheets so far<\/h4>${row('Approved, ready to bill',String(pl.plans.reduce((a,x)=>a+x.ids.length,0)))}${row('Waiting for approval',String(cnt('unapp')),cnt('unapp')?'Approve before the cutoff to include them':'')}${row('No rate for the post site',String(cnt('norate')))}${row('Already billed',String(cnt('dup')))}${cnt('nb')?row('Non-billable',String(cnt('nb'))):''}${row('Total in period',String(all.length))}<\/section>\n    <section class=\"rv-s\"><h4>Estimated ${pl.plans.length>1?plural(pl.plans.length,'invoice'):'invoice'}<\/h4>\n      ${pl.plans.length?`<div class=\"tw\"><table><thead><tr><th>Covers<\/th><th class=\"r\">Hours<\/th><th class=\"r\">Subtotal<\/th><th class=\"r\">Tax ($)<\/th><th class=\"r\">Total<\/th><\/tr><\/thead><tbody>${pl.plans.map((x,i)=>`<tr><td>${esc(scopeOf(c,x.sites))}<\/td><td class=\"r num\">${r2(x.lines.reduce((a,l)=>a+l.hrs,0))}<\/td><td class=\"r num\">${inr(tots[i].sub)}<\/td><td class=\"r num\">${inr(tots[i].tax)}<\/td><td class=\"r num\"><b>${inr(tots[i].total)}<\/b><\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>\n      <p class=\"help\" style=\"margin-top:8px\">Estimate ${inr(est)} from approved, unbilled hours so far. The final amount is calculated at generation time.<\/p>`:`<p class=\"help\">No approved, unbilled hours yet${ended?'':s0>TODAY?' — the period has not started yet':' — the period is still in progress'}.<\/p>`}<\/section>`;\n  document.getElementById('layer').innerHTML = `<div class=\"ov drawer-ov\" data-act=\"bg\"><aside class=\"drawer\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Upcoming invoice run\"><div class=\"dh\"><h3>Upcoming invoice run<\/h3><button class=\"ibtn round-x\" data-act=\"close\" aria-label=\"Close\">${I.x}<\/button><\/div>\n    <div class=\"db rv\" style=\"flex:1\">${body}<\/div>\n    ${paused&&can('pause')?`<div class=\"df\"><button class=\"btn pri\" data-act=\"resume\" data-k=\"${k}\">Resume<\/button><\/div>`:due&&can('run')?`<div class=\"df\"><button class=\"btn pri\" data-act=\"runNow\" data-k=\"${k}\">${I.play}Run now<\/button><\/div>`:''}<\/aside><\/div>`;\n}\nfunction runAction(r){\n  if(r.retry) return `<button class=\"btn ghost sm\" data-act=\"retry\" data-id=\"${r.run}\" ${dis('run')}>${I.retry}Retry<\/button>`;\n  if(r.state==='Due today') return `<button class=\"btn sec sm\" data-act=\"runNow\" data-k=\"${r.k}\" ${dis('run')}>${I.play}Run now<\/button>`;\n  if(r.state==='Will be skipped' && r.first && r.paused) return `<button class=\"btn ghost sm\" data-act=\"resume\" data-k=\"${r.k}\" ${dis('pause')}>Resume<\/button>`;\n  return '';\n}\nfunction estCell(r){\n  if(r.retry || r.state==='Will be skipped') return '<span class=\"muted\">—<\/span>';\n  if(!r.started) return '<span class=\"muted\">Not started<\/span>';\n  const e = estFor(r.k,r.p); return e ? inr(e) : '<span class=\"muted\">$0.00<\/span>';\n}\n\n\n/* =====================================================================\n   INVOICER › OVERVIEW (existing screen, rebuilt to match the live one;\n   Auto Invoicing content added in sections marked NEW)\n   ===================================================================== */\nconst newTag = '<span class=\"new\">NEW<\/span>';\nconst OVPAL = ['#f4473a','#1e94d8','#ec4899','#c27803','#a855f7'];  /* validated for the dark surface */\nfunction ovPayments(){\n  const days = [...Array(7)].map((_,i)=>iso(addD(D(TODAY),i-6)));\n  const pays = [];\n  allInvoices().forEach(r=>{ const v=invModel(r.no); v.payments.forEach(p=>pays.push({...p,no:r.no,client:v.client})); });\n  return days.map(d=>{ const l=pays.filter(p=>p.date===d); return {d,amt:r2(l.reduce((a,p)=>a+p.amount,0)),n:l.length}; });\n}\nfunction ovLine(pts){\n  const W=640,H=260,L=56,Rr=16,T=16,B=36, max=Math.max(1,...pts.map(p=>p.amt)), nice=Math.ceil(max/5000)*5000||5000;\n  const x=i=>L+i*(W-L-Rr)/(pts.length-1), y=v=>T+(H-T-B)*(1-v/nice);\n  const P=pts.map((p,i)=>[x(i),y(p.amt)]);\n  let d=`M${P[0][0]},${P[0][1]}`; for(let i=1;i<P.length;i++){ const [x0,y0]=P[i-1],[x1,y1]=P[i],mx=(x0+x1)/2; d+=` C${mx},${y0} ${mx},${y1} ${x1},${y1}`; }\n  const grid=[0,.25,.5,.75,1].map(f=>`<line x1=\"${L}\" x2=\"${W-Rr}\" y1=\"${y(nice*f)}\" y2=\"${y(nice*f)}\" class=\"ovg\"/><text x=\"${L-8}\" y=\"${y(nice*f)+4}\" text-anchor=\"end\" class=\"ovt\">${cmpAmt(nice*f)}<\/text>`).join('');\n  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];\n  return `<svg class=\"ovline\" viewBox=\"0 0 ${W} ${H}\" role=\"img\" aria-label=\"Payments received in the last 7 days\">${grid}\n    <path d=\"${d}\" fill=\"none\" stroke=\"var(--fg)\" stroke-width=\"2\"/>\n    ${P.map((q,i)=>`<g class=\"ovpt\"><rect x=\"${q[0]-24}\" y=\"${T}\" width=\"48\" height=\"${H-T-B}\" fill=\"transparent\"/><circle cx=\"${q[0]}\" cy=\"${q[1]}\" r=\"${pts[i].amt?4:0}\" fill=\"var(--fg)\" stroke=\"var(--panel)\" stroke-width=\"2\"/><title>${fd(pts[i].d)} · ${inr(pts[i].amt)}${pts[i].n?` · ${plural(pts[i].n,'payment')}`:''}<\/title><\/g>\n      <text x=\"${q[0]}\" y=\"${H-10}\" text-anchor=\"middle\" class=\"ovt ovx\">${days[D(pts[i].d).getDay()]}<\/text>`).join('')}<\/svg>`;\n}\nfunction ovSales(){\n  const m = {};\n  allInvoices().forEach(r=>{ const v=invModel(r.no); v.lines.forEach(l=>{ const k = v.auto ? 'Security guard services (hourly)' : l.name; m[k]=(m[k]||0)+l.amount; }); });\n  const rows = Object.entries(m).sort((a,b)=>b[1]-a[1]); const top = rows.slice(0,4), rest = rows.slice(4).reduce((a,r)=>a+r[1],0);\n  if(rest) top.push(['Other',rest]); return top;\n}\nfunction ovDonut(rows){\n  const tot = rows.reduce((a,r)=>a+r[1],0)||1, W=240, cx=W/2, cy=W/2, R0=78, R1=108;\n  let a0 = -Math.PI/2; const gap = .03;\n  const seg = rows.map(([n,v],i)=>{ const a1=a0+2*Math.PI*v/tot, s0=a0+gap/2, s1=Math.max(s0+.004,a1-gap/2), big=(s1-s0)>Math.PI?1:0;\n    const pt=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)], [x0,y0]=pt(R1,s0),[x1,y1]=pt(R1,s1),[x2,y2]=pt(R0,s1),[x3,y3]=pt(R0,s0); a0=a1;\n    return `<path class=\"ovseg\" d=\"M${x0},${y0} A${R1},${R1} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${R0},${R0} 0 ${big} 0 ${x3},${y3}Z\" fill=\"${OVPAL[i%OVPAL.length]}\"><title>${esc(n)} · ${inr(v)} (${(v/tot*100).toFixed(1)}%)<\/title><\/path>`; }).join('');\n  return `<div class=\"ovdn\"><svg class=\"ovdonut\" viewBox=\"0 0 ${W} ${W}\" role=\"img\" aria-label=\"Sales by product or service\">${seg}\n    <text x=\"${cx}\" y=\"${cy-2}\" text-anchor=\"middle\" class=\"ovc\">${cmpAmt(tot)}<\/text><text x=\"${cx}\" y=\"${cy+18}\" text-anchor=\"middle\" class=\"ovt\">total sales<\/text><\/svg>\n    <ul class=\"ovleg\">${rows.map(([n,v],i)=>`<li><span class=\"sw\" style=\"background:${OVPAL[i%OVPAL.length]}\"><\/span><span class=\"nm\" title=\"${esc(n)}\">${esc(n)}<\/span><span class=\"num\" title=\"${inr(v)}\">${cmpAmt(v)}<\/span><span class=\"pc num\">${(v/tot*100).toFixed(1)}%<\/span><\/li>`).join('')}<\/ul><\/div>`;\n}\nfunction vOverview(){\n  const all = allInvoices(), money = a=>a.reduce((x,r)=>x+r.amtDue,0);\n  const live = all.filter(r= n?'Approved timesheets for this post site are billed.':'This post site is not billed automatically.'}<\/span><\/div><\/div>\n      <div class=\"swrow\" style=\"margin-top:16px;padding-top:16px;border-top:1px solid var(--line)\">${sw(n===0||(n===1&&!o.on),'siteInherit',`data-k=\"${k}\" data-s=\"${s}\" aria-label=\"Inherit all client settings\" ${RO}`)}<div><b>Inherit all client settings<\/b><span>${n-(o.on?0:1)>0?`${plural(n-(o.on?0:1),'setting')} overridden. Turn on to reset them to the client values.`:'Every setting below follows the client configuration.'}<\/span><\/div><\/div><\/section>\n    <section class=\"card flush\"><div class=\"card-h\"><h2>Effective configuration<\/h2><p>What is actually used when this post site is billed.<\/p><\/div>\n      <div class=\"tw\" style=\"margin-top:14px\"><table><thead><tr><th>Setting<\/th><th>Effective value<\/th><th>Source<\/th><th class=\"act\"><\/th><\/tr><\/thead><tbody>\n      ${rows.map(r=>`<tr><td>${r.label}<\/td><td>${ed===r.key?r.edit:`<b style=\"font-weight:600\">${r.val}<\/b>${r.note?`<span class=\"sub\">${r.note}<\/span>`:''}`}<\/td><td>${src(r.custom)}<\/td>\n        <td class=\"act\">${ed===r.key?`<button class=\"btn pri sm\" data-act=\"siteSave\" data-k=\"${k}\" data-s=\"${s}\" data-key=\"${r.key}\">Save<\/button> <button class=\"btn ghost sm\" data-act=\"siteEdit\" data-key=\"\">Cancel<\/button>`\n        :`${r.custom?`<button class=\"lnk\" data-act=\"siteReset\" data-k=\"${k}\" data-s=\"${s}\" data-key=\"${r.key}\" ${RO}>Reset to client<\/button> &nbsp; `:''}<button class=\"btn ghost sm\" data-act=\"siteEdit\" data-key=\"${r.key}\" ${RO}>${r.custom?'Edit':'Override'}<\/button>`}<\/td><\/tr>`).join('')}\n      ${locked.map(([l,v])=>`<tr><td>${l}<\/td><td>${esc(v)}<\/td><td><span class=\"tag inh\">${I.lock}Client level only<\/span><\/td><td class=\"act\"><\/td><\/tr>`).join('')}\n      <\/tbody><\/table><\/div><\/section>\n  <\/div>`;\n}\n\n/* =====================================================================\n   6 · UPCOMING RUNS (list + calendar)\n   ===================================================================== */\nfunction vRuns(){\n  const view = S.f.runV || 'list';\n  const head = pageHead({tabs:aisTabs('runs'),crumbs:[AUTO,['Upcoming Runs']],title:'Upcoming Runs',sub:'When each client\\'s next invoices will be generated. Run now is available on the scheduled day.'});\n  const toggle = seg('runV',view,[['list','List'],['cal','Calendar']]);\n  if(view==='cal') return `${head}<div class=\"toolbar\">${toggle}<span class=\"sp\"><\/span>${seg('calM',S.f.calM||'2026-11',[['2026-10','October 2026'],['2026-11','November 2026']])}<\/div>${vCalendar()}`;\n  const fc = S.f.runC||'all', fs = S.f.runS||'all';\n  let rows = upcomingRows(3), pd = pastDueRows();\n  if(fc!=='all'){ rows = rows.filter(r=>r.k===fc); pd = pd.filter(r=>r.k===fc); }\n  if(fs!=='all'){ rows = rows.filter(r=>r.state===fs); pd = pd.filter(r=>r.state===fs); }\n  return `${head}<div class=\"toolbar\">${toggle}${fsel('runC',fc,[['all','All clients'],...Object.keys(S.setups).filter(k=>S.setups[k].status!=='Off').map(k=>[k,C(k).name])],'Client')}${fsel('runS',fs,[['all','All statuses'],['Due today','Due today'],['Scheduled','Scheduled'],['Partially completed','Needs retry'],['Will be skipped','Will be skipped']],'Status')}<\/div>\n  ${pd.length?`<h2 class=\"sec-t\">Missed or failed <span class=\"muted\" style=\"font-weight:400\">· ${pd.length} need action<\/span><\/h2>\n  <div class=\"card flush\" style=\"margin-bottom:22px\"><div class=\"tw\"><table><thead><tr><th>Client<\/th><th>Billing period<\/th><th>Was scheduled<\/th><th>What happened<\/th><th>Status<\/th><th class=\"act\">Actions<\/th><\/tr><\/thead><tbody>\n  ${pd.map(r=>`<tr class=\"click\" data-act=\"${r.retry?'retry':'runView'}\" data-id=\"${r.run||''}\" data-k=\"${r.k}\" data-s=\"${r.p[0]}\" data-e=\"${r.p[1]}\" data-g=\"${r.gen}\"><td>${esc(C(r.k).name)}<\/td><td class=\"num nw\">${per(r.p)}<\/td><td class=\"num nw\">${ft(r.gen)}<\/td><td class=\"muted\" style=\"min-width:240px\">${esc(r.why)}<\/td><td>${st(r.state)}<\/td><td class=\"act\">${runAction(r)}${S.setups[r.k]?kebab('cfg:'+r.k):''}<\/td><\/tr>`).join('')}\n  <\/tbody><\/table><\/div><\/div>`:''}\n  <h2 class=\"sec-t\">Upcoming<\/h2>\n  <div class=\"card flush\"><div class=\"tw\"><table><thead><tr><th>Client<\/th><th>Billing period<\/th><th>Scheduled<\/th><th class=\"r\">Post sites<\/th><th class=\"r\">Est. amount<\/th><th>Status<\/th><th class=\"act\">Actions<\/th><\/tr><\/thead><tbody>\n  ${rows.map(r=>`<tr class=\"click\" data-act=\"${r.retry?'retry':'runView'}\" data-id=\"${r.run||''}\" data-k=\"${r.k}\" data-s=\"${r.p[0]}\" data-e=\"${r.p[1]}\" data-g=\"${r.gen}\"><td>${esc(C(r.k).name)}<\/td><td class=\"num nw\">${per(r.p)}<\/td><td class=\"num nw\">${ft(r.gen)}<\/td><td class=\"r num\">${sitesOn(r.c).length}<\/td><td class=\"r num\">${estCell(r)}<\/td><td>${st(r.state)}<\/td><td class=\"act\">${runAction(r)}${S.setups[r.k]?kebab('cfg:'+r.k):''}<\/td><\/tr>`).join('') || `<tr><td colspan=\"7\">${empty('No runs match','Choose another client or status.')}<\/td><\/tr>`}\n  <\/tbody><\/table><\/div><\/div>\n  <p class=\"help\" style=\"margin-top:10px\">Estimated amounts include approved, unbilled hours so far. Final amounts are calculated at generation time.<\/p>`;\n}\nfunction calRows(m){\n  const rows = S.runs.filter(r=>r.at.startsWith(m)).map(r=>{ const made=r.invoices.filter(n=>S.inv[n]&&S.inv[n].run===r.id); return {at:r.at,k:r.client,p:r.p,st:runStatus(r),run:r.id,made,trig:r.trigger,amt:made.reduce((a,n)=>a+totals(S.inv[n]).total,0)}; });\n  for(const [k,c] of Object.entries(S.setups)){\n    if(c.status==='Off') continue;\n    for(const x of nextRuns(c,14)){\n      if(x.gen.slice(0,7)>m) break;\n      if(!x.gen.startsWith(m) || x.gen<=NOW) continue;\n      const started = x.s<=TODAY, s = c.status==='Paused' ? 'Will be skipped' : x.gen.slice(0,10)===TODAY ? 'Due today' : 'Scheduled';\n      rows.push({at:x.gen,k,p:[x.s,x.e],st:s,future:true,started,amt:c.status==='Paused'||!started?0:estFor(k,[x.s,x.e])});\n    }\n  }\n  return rows.sort((a,b)=>a.at.localeCompare(b.at));\n}\nfunction vCalendar(){\n  const m = S.f.calM || '2026-11', rows = calRows(m), past = rows.filter(r=>!r.future), fut = rows.filter(r=>r.future);\n  let day = '';\n  const body = rows.map(r=>{\n    const d = r.at.slice(0,10), head = d!==day ? `<tr class=\"grp\"><td colspan=\"5\">${DOW[D(d).getDay()]} ${fd(d)}${d===TODAY?' · Today':''}<\/td><\/tr>` : ''; day = d;\n    const inv = r.future ? (r.st==='Will be skipped'?'<span class=\"muted\">Client paused<\/span>':!r.started?'<span class=\"muted\">Period not started<\/span>':`<span class=\"muted\">${inr(r.amt,false)} so far<\/span>`)\n      : r.made.length ? `${r.made.join(', ')}<span class=\"sub\">${inr(r.amt,false)}<\/span>` : '<span class=\"muted\">No invoice<\/span>';\n    const btn = r.st==='Due today' ? `<button class=\"btn sec sm\" data-act=\"runNow\" data-k=\"${r.k}\" ${dis('run')}>${I.play}Run now<\/button>` : '';\n    return `${head}<tr class=\"${r.future?'':'click'}\" ${r.future?'':`data-act=\"cvGo\" data-k=\"${r.k}\"`}><td class=\"num nw\">${tm(r.at.slice(11,16))}<\/td><td>${esc(C(r.k).name)}<span class=\"sub\">${per(r.p)}<\/span><\/td><td>${st(r.st)}<\/td><td class=\"num\">${inv}<\/td><td class=\"act\">${btn}<\/td><\/tr>`;\n  }).join('');\n  return `<p class=\"help\" style=\"margin-bottom:12px\">${plural(past.length,'run')} completed · ${plural(past.reduce((a,r)=>a+r.made.length,0),'invoice')} generated (${inr(past.reduce((a,r)=>a+r.amt,0),false)}) · ${plural(fut.length,'run')} still to come<\/p>\n  <div class=\"card flush\"><div class=\"tw\"><table><thead><tr><th>Time<\/th><th>Client<\/th><th>Status<\/th><th>Invoices<\/th><th class=\"act\"><\/th><\/tr><\/thead><tbody>${body||`<tr><td colspan=\"5\">${empty('Nothing this month','')}<\/td><\/tr>`}<\/tbody><\/table><\/div><\/div>`;\n}\n\n/* =====================================================================\n   7 · GENERATED INVOICES\n   ===================================================================== */\n/* Generated Invoices now use the existing Invoicer › Invoices list (Source = Automatic). */\n\n/* =====================================================================\n   8 · INVOICE REVIEW AND APPROVAL\n   ===================================================================== */\nfunction tsTable(ids){\n  return `<div class=\"tw\" style=\"max-height:480px;overflow-y:auto\"><table><thead><tr><th>Timesheet<\/th><th>Guard<\/th><th>Post site<\/th><th>Shift<\/th><th class=\"r\">Hours<\/th><th>Status<\/th><th>Billed on<\/th><\/tr><\/thead><tbody>\n  ${ids.map(id=>{ const t=S.ts[id]; return `<tr><td class=\"nw\">${id}<\/td><td class=\"nw\">${esc(t.guard)}<\/td><td class=\"nw\">${esc(site(t.site).name)}<\/td><td class=\"num nw\">${fd(t.date)}<span class=\"sub\">${t.start} – ${t.end}${t.night?' (+1 day)':''}<\/span><\/td>\n    <td class=\"r num\">${t.changed?`<span class=\"diff-old\">${t.changed.from}<\/span> <span class=\"diff-new\">${t.hrs}<\/span>`:t.hrs}${t.ot?`<span class=\"sub\">+${t.ot} OT<\/span>`:''}<\/td>\n    <td class=\"nw\">${t.status==='Approved'?(t.changed?'<span style=\"color:#ffd572\">Changed after billing<\/span>':'Approved'):`<span style=\"color:#ffd572\">${esc(t.status)}<\/span>`}<\/td><td class=\"nw\">${t.billedOn?t.billedOn:'<span class=\"muted\">Not billed<\/span>'}<\/td><\/tr>`; }).join('')}\n  <\/tbody><\/table><\/div>`;\n}\n\n/* =====================================================================\n   9 · BILLING EXCEPTIONS\n   ===================================================================== */\nfunction vExceptions(){\n  const f = S.f.exS || 'Open', sv = S.f.exV || 'all', q = (S.f.exQ||'').toLowerCase();\n  const ord = {block:0,review:1,fyi:2};\n  let rows = S.issues.filter(x=>f==='all'||exStatus(x)===f);\n  if(sv!=='all') rows = rows.filter(x=>x.sev===sv);\n  if(q) rows = rows.filter(x=>(x.id+' '+C(x.client).name+' '+exType(x)).toLowerCase().includes(q));\n  rows.sort((a,b)=>ord[a.sev]-ord[b.sev]||a.id.localeCompare(b.id));\n  const n = s => S.issues.filter(x=>exStatus(x)===s).length;\n  return `${pageHead({tabs:aisTabs('exceptions'),crumbs:[AUTO,['Billing Exceptions']],title:'Billing Exceptions',sub:'Problems found while generating invoices. Blocking exceptions stop an invoice from being generated or approved.'})}\n  <div class=\"toolbar\">${seg('exS',f,[['Open',`Open (${n('Open')})`],['Resolved',`Resolved (${n('Resolved')})`],['all','All']])}${search('exQ','Search exceptions')}${fsel('exV',sv,[['all','All severities'],['block','Blocking'],['review','Warning'],['fyi','Info']],'Severity')}<\/div>\n  <div class=\"card flush\"><div class=\"tw\"><table><thead><tr><th>ID<\/th><th>Client<\/th><th>Post site<\/th><th>Exception type<\/th><th>Severity<\/th><th>Billing period<\/th><th>Status<\/th><th>Assigned to<\/th><th class=\"act\"><\/th><\/tr><\/thead><tbody>\n  ${rows.map(x=>`<tr class=\"click\" data-act=\"openEx\" data-id=\"${x.id}\"><td class=\"nw\"><b>${x.id}<\/b><\/td><td>${esc(C(x.client).name)}<\/td><td>${x.site?esc(site(x.site).name):'<span class=\"muted\">—<\/span>'}<\/td><td>${exType(x)}<\/td><td>${st(SEVL[x.sev])}<\/td><td class=\"num nw\">${x.p?per(x.p):'<span class=\"muted\">—<\/span>'}<\/td><td>${st(exStatus(x))}<\/td><td class=\"nw\">${x.owner?esc(x.owner):'<span class=\"muted\">Unassigned<\/span>'}<\/td>\n    <td class=\"act\"><button class=\"btn ${x.status==='Open'&&x.fix?'sec':'ghost'} sm\" data-act=\"openEx\" data-id=\"${x.id}\">${x.status==='Open'&&x.fix?'Resolve':'View'}<\/button><\/td><\/tr>`).join('') || `<tr><td colspan=\"9\">${empty(f==='Open'?'No open exceptions':'Nothing here','Every invoice passed its checks.')}<\/td><\/tr>`}\n  <\/tbody><\/table><\/div><\/div>`;\n}\nconst CAUSE = {\n  'IS-101':'Emergency Room Entrance has its hourly, overtime and holiday rates in rule Lakeside Medical Center · weekly, but special event shifts are priced separately and this one was never priced.',\n  'IS-102':'The run reached its processing time limit while generating the second invoice. Invoices are saved one at a time, so the first was already created.',\n  'IS-103':'A supervisor edited the approved timesheet after the draft was generated (the guard stayed for a handover).',\n  'IS-104':'The client record was created without billing details, which every invoice needs.',\n  'IS-105':'The supervisor has not approved the shift, and the approval cutoff (01/11/2026, 6:00 PM) has passed.',\n  'IS-106':'The supervisor has not approved the shift yet. The cutoff is today at 6:00 PM.',\n  'IS-100':'The night shift crosses midnight into the next billing week, so it appeared in both periods.',\n};\nfunction vException(){\n  const x = S.issues.find(i=>i.id===S.sel), ro = !can('fix'), open = x.status==='Open', t = x.ts ? S.ts[x.ts] : null;\n  const blocks = x.sev==='block' && open;\n  let fix = '';\n  if(x.fix==='rate') fix = `<div class=\"toolbar\" style=\"margin:0;align-items:flex-end\">${field('evRate','Special event rate ($ per hour)',`<input id=\"evRate\" type=\"number\" value=\"55\" min=\"0\" ${ro?'readonly':''}>`)}<button class=\"btn pri\" data-act=\"fixRate\" data-id=\"${x.id}\" ${dis('fix')}>Save rate and regenerate<\/button><\/div>`;\n  if(x.fix==='retry') fix = `<button class=\"btn pri\" data-act=\"retry\" data-id=\"${x.run}\" ${dis('run')}>${I.retry}Retry the run<\/button>`;\n  if(x.fix==='recalc') fix = `<button class=\"btn pri\" data-act=\"recalc\" data-id=\"${x.inv}\" ${dis('fix')}>${I.retry}Regenerate draft ${x.inv}<\/button>`;\n  if(x.fix==='details') fix = `<button class=\"btn pri\" data-act=\"addDetails\" data-k=\"${x.client}\" ${dis('fix')}>Add billing details<\/button>`;\n  if(x.fix==='cfg') fix = `<button class=\"btn pri\" data-act=\"cfgOpen\" data-k=\"${x.client}\" data-sec=\"sched\" ${dis('setup')}>Fix the billing schedule<\/button><p class=\"help\" style=\"margin-top:8px\">Saving a valid schedule closes this exception.<\/p>`;\n  if(x.fix==='approve') fix = `<div class=\"toolbar\" style=\"margin:0\"><button class=\"btn pri\" data-act=\"tsDecide\" data-id=\"${x.id}\" data-v=\"Approved\" ${dis('fix')}>Approve timesheet<\/button><button class=\"btn ghost\" data-act=\"tsDecide\" data-id=\"${x.id}\" data-v=\"Rejected\" ${dis('fix')}>Reject timesheet<\/button><\/div>`;\n  return `${pageHead({crumbs:[AUTO,['Billing Exceptions','exceptions'],[x.id]],title:esc(x.title),status:`${st(SEVL[x.sev])}${st(exStatus(x))}`,sub:`${x.id} · ${exType(x)} · ${esc(C(x.client).name)}${x.site?' · '+esc(site(x.site).name):''}`})}\n  <div class=\"split\"><div class=\"stack\">\n    <section class=\"card\"><dl class=\"dl\">\n      <dt>What went wrong<\/dt><dd>${esc(x.what)}<\/dd>\n      <dt>Why it happened<\/dt><dd>${esc(CAUSE[x.id]||x.cause||'Found while validating billing records for this run.')}<\/dd>\n      <dt>Impact<\/dt><dd>${esc(x.why)}<\/dd>\n      <dt>Invoice generation<\/dt><dd>${blocks?`<span style=\"color:#ffa8a8\">Blocked<\/span>`:x.sev==='block'?'No longer blocked':'Not blocked'}${x.inv?` · <button class=\"lnk\" data-act=\"openInv\" data-id=\"${x.inv}\">Invoice ${x.inv}<\/button>`:''}${x.run?` · <button class=\"lnk\" data-act=\"openRun\" data-id=\"${x.run}\">${x.run}<\/button>`:''}<\/dd>\n      <dt>Required action<\/dt><dd>${esc(x.how)}<\/dd><\/dl><\/section>\n    ${open&&fix?`<section class=\"card\"><div class=\"card-h\"><h2>Resolve<\/h2><\/div>${fix}<\/section>`:''}\n    ${t?`<section class=\"card flush\"><div class=\"card-h\"><h2>Affected records<\/h2><\/div><div style=\"margin-top:14px\">${tsTable([t.id])}<\/div>${t.note||t.changed?`<p class=\"help\" style=\"padding:12px 20px\">${esc(t.note||'')}${t.changed?`Changed by ${esc(t.changed.by)} on ${ft(t.changed.on)}: ${esc(t.changed.why)}`:''}<\/p>`:''}<\/section>`:''}\n  <\/div>\n  <aside class=\"card\"><div class=\"stack\" style=\"gap:16px\">\n    ${field('owner','Assigned to',`<select id=\"owner\" data-act=\"assign\" data-id=\"${x.id}\" ${ro||!open?'disabled':''}><option value=\"\">Unassigned<\/option>${['Michael Turner','Sarah Mitchell','David Brooks'].map(u=>`<option ${x.owner===u?'selected':''}>${u}<\/option>`).join('')}<\/select>`)}\n    ${field('noteIn','Add a note',`<textarea id=\"noteIn\" placeholder=\"What you did or found\" ${ro?'readonly':''}><\/textarea>`)}\n    <div><button class=\"btn ghost sm\" data-act=\"addNote\" data-id=\"${x.id}\" ${ro?'disabled':''}>Add note<\/button><\/div>\n    <div><h3 style=\"font-size:14px;font-weight:600;margin-bottom:10px\">Activity<\/h3><ul class=\"tl\">${x.hist.slice().reverse().map(h=>`<li><span>${ft(h.t)} · ${esc(h.a)}<\/span>${esc(h.e)}<\/li>`).join('')}<\/ul><\/div>\n  <\/div><\/aside><\/div>`;\n}\n\n/* =====================================================================\n   10 · BILLING RUN DETAILS\n   ===================================================================== */\nfunction vRun(){\n  const r = S.runs.find(x=>x.id===S.sel), tab = S.f.runTab || 'sum';\n  const made = r.invoices.filter(n=>S.inv[n]);\n  const tsIds = [...new Set(made.filter(n=>S.inv[n].run===r.id||r.attempt>1).flatMap(n=>S.inv[n].lines.flatMap(l=>l.ts)))];\n  const amt = made.filter(n=>S.inv[n].run===r.id).reduce((a,n)=>a+totals(S.inv[n]).total,0);\n  const attempts = S.runs.filter(x=>x.client===r.client && x.p[0]===r.p[0] && x.p[1]===r.p[1]).sort((a,b)=>a.attempt-b.attempt||a.at.localeCompare(b.at));\n  const exs = S.issues.filter(x=>x.run===r.id || (x.inv && r.invoices.includes(x.inv)));\n  const canRetry = r.result==='Failed' && !r.retried;\n  let body = '';\n  if(tab==='sum') body = `<div class=\"split\"><section class=\"card\"><div class=\"card-h\"><h2>Processing steps<\/h2><\/div><p style=\"margin-bottom:14px\">${esc(r.text)}<\/p><ol class=\"rsteps\">${r.steps.map(s=>`<li class=\"st-${s.s}\"><span class=\"d\">${s.s==='done'?'✓':s.s==='fail'?'✕':s.s==='warn'?'!':'–'}<\/span><div>${esc(s.t)}${s.d?`<small>${esc(s.d)}<\/small>`:''}<\/div><\/li>`).join('')}<\/ol>\n      ${canRetry?`<button class=\"btn pri\" style=\"margin-top:14px\" data-act=\"retry\" data-id=\"${r.id}\" ${dis('run')}>${I.retry}Retry the run<\/button>`:''}<\/section>\n    <section class=\"card\"><div class=\"card-h\"><h2>Related invoices<\/h2><\/div>${made.length?`<ul class=\"tl\">${made.map(n=>`<li><button class=\"lnk\" data-act=\"openInv\" data-id=\"${n}\">Invoice ${n}<\/button> &nbsp;${st(apprStatus(S.inv[n]))}<span>${esc(S.inv[n].scope)} · ${inr(totals(S.inv[n]).total)}${S.inv[n].run!==r.id?' · reused from attempt 1':''}<\/span><\/li>`).join('')}<\/ul>`:'<p class=\"muted\">No invoice was generated.<\/p>'}<\/section><\/div>`;\n  if(tab==='rec') body = tsIds.length ? `<div class=\"card flush\">${tsTable(tsIds)}<\/div>` : `<div class=\"card\">${empty('No billing records','This run did not bill any timesheets.')}<\/div>`;\n  if(tab==='calc') body = made.length ? `<div class=\"stack\">${made.map(n=>{ const i=S.inv[n], t=totals(i); return `<section class=\"card flush\"><div class=\"card-h\"><h2>Invoice ${n}<\/h2><span class=\"muted\" style=\"font-size:13px\">${esc(i.scope)}<\/span><\/div><div class=\"tw\" style=\"margin-top:14px\"><table><thead><tr><th>Post site<\/th><th>Line<\/th><th class=\"r\">Hours<\/th><th class=\"r\">Rate<\/th><th class=\"r\">Amount<\/th><\/tr><\/thead><tbody>\n      ${i.lines.map(l=>`<tr><td>${esc(site(l.site).name)}<\/td><td>${l.desc}<\/td><td class=\"r num\">${l.hrs}<\/td><td class=\"r num\">${inr(l.rate)}<\/td><td class=\"r num\">${inr(r2(l.hrs*l.rate))}<\/td><\/tr>`).join('')}\n      <tr class=\"tfoot\"><td colspan=\"4\">Subtotal · tax ${inr(t.tax)}<\/td><td class=\"r num\">${inr(t.total)}<\/td><\/tr><\/tbody><\/table><\/div><\/section>`; }).join('')}<p class=\"help\">Rates come from the configuration in force for the billing period: post-site override first, then the client rate.<\/p><\/div>` : `<div class=\"card\">${empty('Nothing calculated','No billable hours were found for this period.')}<\/div>`;\n  if(tab==='val') body = `<div class=\"stack\"><section class=\"card\"><div class=\"card-h\"><h2>Validation results<\/h2><\/div><ul class=\"checks\">\n      ${r.steps.filter(s=>/problem|Check|paused/i.test(s.t+s.d)).map(s=>`<li><span class=\"i ${s.s==='warn'||s.s==='fail'?'x':'p'}\">${s.s==='warn'||s.s==='fail'?'!':'✓'}<\/span><div>${esc(s.d||s.t)}<\/div><\/li>`).join('')}\n      <li><span class=\"i p\">✓<\/span><div>No timesheet was billed twice<\/div><\/li><\/ul><\/section>\n    ${(r.skipped||[]).length?`<section class=\"card flush\"><div class=\"card-h\"><h2>Records left off<\/h2><\/div><div class=\"tw\" style=\"margin-top:14px\"><table><thead><tr><th>Timesheet<\/th><th>Reason<\/th><\/tr><\/thead><tbody>${r.skipped.map(x=>`<tr><td class=\"nw\">${x.ts}<\/td><td>${esc(x.why)}<\/td><\/tr>`).join('')}<\/tbody><\/table><\/div><\/section>`:''}\n    <section class=\"card flush\"><div class=\"card-h\"><h2>Exceptions raised<\/h2><\/div><div class=\"tw\" style=\"margin-top:14px\"><table><thead><tr><th>ID<\/th><th>Type<\/th><th>Severity<\/th><th>Status<\/th><\/tr><\/thead><tbody>${exs.map(x=>`<tr class=\"click\" data-act=\"openEx\" data-id=\"${x.id}\"><td>${x.id}<\/td><td>${exType(x)}<\/td><td>${st(SEVL[x.sev])}<\/td><td>${st(exStatus(x))}<\/td><\/tr>`).join('')||`<tr><td colspan=\"4\" class=\"muted\">None<\/td><\/tr>`}<\/tbody><\/table><\/div><\/section><\/div>`;\n  if(tab==='act') body = `<div class=\"card\"><ul class=\"tl\">${attempts.map(a=>`<li><span>${ft(a.at)} · attempt ${a.attempt} · ${esc(a.trigger)}${a.by&&a.by!=='System'?' by '+esc(a.by):''}<\/span>${a.id===r.id?'<b>This run<\/b>':`<button class=\"lnk\" data-act=\"openRun\" data-id=\"${a.id}\">${a.id}<\/button>`} · ${runStatus(a)}<\/li>`).join('')}\n      ${S.log.filter(l=>l.client===r.client && r.invoices.some(n=>l.detail.includes(n))).map(l=>`<li><span>${ft(l.t)} · ${esc(l.who)}<\/span>${esc(l.what)}: ${esc(l.detail)}<\/li>`).join('')}<\/ul>\n      ${attempts.length>1?'<p class=\"help\" style=\"margin-top:14px\">A retry finishes the same run. Invoices already generated are reused, never t)}<\/td><td class=\"nw\">${esc(l.who)}<\/td><td>${esc(l.what)}<\/td><td class=\"nw\">${esc(C(l.client)?.name||'—')}<\/td><td><span class=\"trunc\" title=\"${esc(l.detail)}\">${esc(l.detail)}<\/span><\/td><\/tr>`).join('')||`<tr><td colspan=\"5\">${empty('No entries match','')}<\/td><\/tr>`}<\/tbody><\/table><\/div><\/div>`;\n  }\n  if(view==='ts'){\n    const m = S.f.tsM || '2026-10', k = S.f.tsC || 'all';\n    const list = Object.values(S.ts).filter(t=>t.date.startsWith(m) && (k==='all'||site(t.site).client===k)).sort((a,b)=>a.date.localeCompare(b.date)||a.site.localeCompare(b.site));\n    const hrs = list.reduce((a,t)=>a+t.hrs+t.ot,0), billed = list.filter(t=>t.billedOn).length;\n    const clients = [...new Set(Object.values(S.ts).map(t=>site(t.site).client))];\n    return `${head}<div class=\"toolbar\">${toggle}${fsel('tsM',m,[['2026-09','September 2026'],['2026-10','October 2026'],['2026-11','November 2026']],'Month')}${fsel('tsC',k,[['all','All clients'],...clients.map(c=>[c,C(c).name])],'Client')}<span class=\"sp\"><\/span><span class=\"help\">${plural(list.length,'timesheet')} · ${hrs} h · ${billed} billed · ${list.filter(t=>t.status!=='Approved').length} not approved<\/span><\/div>\n    <div class=\"card flush\">${list.length?tsTable(list.map(t=>t.id)):empty('No timesheets','Choose another month or client.')}<\/div>`;\n  }\n  const q=(S.f.hisQ||'').toLowerCase(), fc=S.f.hisC||'all', fr=S.f.hisR||'all';\n  let rows = S.runs.slice().sort((a,b)=>b.at.localeCompare(a.at)||b.attempt-a.attempt);\n  if(q) rows = rows.filter(r=>(r.id+' '+C(r.client).name+' '+r.invoices.join(' ')).toLowerCase().includes(q));\n  if(fc!=='all') rows = rows.filter(r=>r.client===fc);\n  if(fr!=='all') rows = rows.filter(r=>runStatus(r)===fr);\n  if(S.f.hisFail) rows = rows.filter(r=>['Failed','Partially completed'].includes(runStatus(r)));\n  return `${head}<div class=\"toolbar\">${toggle}${search('hisQ','Run ID, client or invoice')}${fsel('hisC',fc,[['all','All clients'],...Object.keys NEVENTS = [['approval','Invoice awaiting approval'],['auto','Invoice approved automatically'],['failed','Invoice run failed'],['exception','Billing exception raised']];\n/* =====================================================================\n   DIALOGS, MENUS, NOTIFICATIONS\n   ===================================================================== */\n/* one message style for every dialog: icon, title, message, then Cancel / Confirm in a footer band */\nconst MICON = {\n  danger:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><path d=\"M12 3 2 20h20z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg>',\n  warn:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><path d=\"M12 3 2 20h20z\"/><path d=\"M12 10v4M12 17h.01\"/><\/svg>',\n  confirm:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4M12 17h.01\"/><\/svg>',\n  info:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v6M12 7.5h.01\"/><\/svg>',\n  ok:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 12.5 4 4 8-9\"/><\/svg>',\n};\nlet _mIcon = null;\nfunction modalI(icon, ...a){ _mIcon = icon; modal(...a); }\nfunction modal(title, body, foot, wide, icon){\n  icon = icon || _mIcon; _mIcon = null;\n  /* confirmations read like the live app: \"Confirm Action\" / \"Are you sure you want to …?\" / Cancel · Confirm */\n  let ask = false;\n  if(icon && /\\?\\s*$/.test(title.replace(/<[^>]+>/g,''))){\n    const q = title.replace(/<[^>]+>/g,'').trim().replace(/\\?$/,'');\n    body = `<p class=\"mask\">Are you sure you want to ${q.charAt(0).toLower o ${to}`); if(S.inv[v.no]) (S.inv[v.no].hist=S.inv[v.no].hist||[]).push({t:stamp(),e:`Payment receipt sent to ${to}`});\n    closeLayer(); render(); snack('Receipt sent successfully'); },\n  payReceiptView:el=>{ const v=invModel(el.dataset.id), p=v.payments.find(x=>x.id===el.dataset.p);\n    modal('Payment receipt',`<div class=\"doc\" style=\"padding:20px\"><div class=\"doc-top\"><div>${logo}<\/div><div style=\"text-align:right\"><b>Demo Security Services - DSS<\/b><div class=\"muted\">San Jose, CA, USA<\/div><\/div><\/div>\n      <dl class=\"dl\"><dt>Received from<\/dt><dd>${esc(C(v.client).name)}<\/dd><dt>Invoice<\/dt><dd>${v.no}<\/dd><dt>Payment date<\/dt><dd>${fdl(p.date)}<\/dd><dt>Method<\/dt><dd>${esc(p.method)}<\/dd><dt>Amount<\/dt><dd><b>${inr(p.amount)}<\/b><\/dd><dt>Balance due<\/dt><dd>${inr(Math.max(0,v.total-paidOf(v)))}<\/dd><\/dl><\/div>`,\n      `<button class=\"btn ghost\" data-act=\"close\">Close<\/button><button class=\"btn pri\" data-act=\"invDownload\" data-id=\"${v.no}\">Download<\/button>`); },\n});\n\n\n/* =====================================================================\n   GUARDSPRO SETTINGS (profile menu › Settings)\n   Auto Invoicing permissions live in Settings › User Roles › role › Invoicer,\n   its alerts in Settings › Notifications, and its company rules in\n   Settings › Global Settings › Auto Invoicing.\n   ===================================================================== */\nconst IPERMS = [\n  ['vOverview','View Overview'],['vEst','View Estimate'],['eEst','Add/Edit Estimate'],['dEst','Delete Estimate'],['cEst','Convert Estimate to Invoice'],['xEst','Export/Email Estimate'],\n  ['vInv','View Invoice'],['eInv','Add/Edit Invoice'],['dInv','Delete Invoice'],['pay','Record A Payment'],['xInv','Export/Email Invoice'],['vPS','View Products and Services'],\n  ['ePS','Add/Edit Products and Services'],['dPS','Delete Products and Services'],\n];\nconst MODULES = ['Clients','Post Site','Guards','Back-Office Users','Analytics','Tracker {c!=null?`<span class=\"c\">${c}<\/span>`:''}<\/button>`).join('')}<\/div>`;\n}\nfunction vAiCfg(){\n  const ks = Object.keys(S.clients).sort((a,b)=>C(a).name.localeCompare(C(b).name));\n  return `${pageHead({crumbs:[['Settings','gs-profile'],['Auto Invoicing','gs-auto'],['Billing Configurations']],title:'Billing Configurations',sub:'Each client’s configuration lives in its client record (Clients → client → Auto Invoicing). This list shows them all in one place.'})}\n  <div class=\"card flush\"><div class=\"tw\"><table><thead><tr><th>Client<\/th><th>Frequency<\/th><th>Invoice grouping<\/th><th>Approval<\/th><th>Next scheduled run<\/th><th>Status<\/th><th class=\"act\"><\/th><\/tr><\/thead><tbody>\n  ${ks.map(k=>{ const c=S.setups[k], nx=c&&c.status==='On'?nextRuns(c,1)[0]:null; return `<tr class=\"click\" data-act=\"cvGo\" data-k=\"${k}\"><td><b>${esc(C(k).name)}<\/b><span class=\"sub\">${plural(Object.keys(S.sites).filter(x=>S.sites[x].client===k).length,'post site')}<\/span><\/td>\n    ${c?`<td>${FREQL[c.freq]}<\/td><td>${groupWords(c)}<\/td><td>${APPRL[c.approval]}<\/td><td class=\"num\">${nx?ft(nx.gen):'<span class=\"muted\">—<\/span>'}<\/td><td>${st(cfgStatus(c))}<\/td>`:'<td colspan=\"4\" class=\"muted\">Not set up<\/td><td>'+st('Not configured')+'<\/td>'}\n    <td class=\"act\"><button class=\"btn ghost sm\" data-act=\"cvGo\" data-k=\"${k}\">${c?'Open':'Set up'}<\/button><\/td><\/tr>`; }).join('')}\n  <\/tbody><\/table><\/div><\/div>`;\n}\n\n/* =====================================================================\n   RUN AUTO INVOICING (user-initiated): Select → Analyze → Review → Generate\n   Uses the same rules as scheduled runs. Always creates Draft invoices.\n   ===================================================================== */\nconst ARP = [['week','Weekly'],['twoweeks','Biweekly'],['twice','Semi-monthly'],['month','Monthly'],['custom','Custom Date Range']];\nfunction arPeriod(type){\n  const t = D(TODAY);\n  if(type==='month'){ const s=new Date(t.getFullYear(),t.getMonth()-1,1), e=new Date(t.getFullYear(),t.getMonth(),0); return [iso(s),iso(e)]; }\n  if(type==='twice'){ if(t.getDate()>15) return [iso(new Date(t.getFullYear(),t.getMonth(),1)),iso(new Date(t.getFullYear(),t.getMonth(),15))]; return [iso(new Date(t.getFullYear(),t.getMonth()-1,16)),iso(new Date(t.getFullYear(),t.getMonth(),0))]; }\n  const end = addD(t,-(t.getDay()||7)); /* last Sunday before today */\n  return [iso(addD(end,type==='twoweeks'?-13:-6)), iso(end)];\n}\nconst arNew = () => { const p=arPeriod('month'); return {step:1,period:'month',from:p[0],to:p[1],clients:[],sites:[],group:'config',more:false,res:null,inc:{},open:{},done:null}; };\nfunction arAnalyze(){\n  const a = S.ar, p = [a.from,a.to], out = [];\n  for(const k of a.clients){\n    const cl = C(k), c0 = S.setups[k], sids = Object.keys(S.sites).filter(x=>S.sites[x].client===k);\n    if(!c0){ out.push({k,block:'nocfg',why:'No billing configuration, so there are no rates to bill with.'}); continue; }\n    if(!cl.addr||!cl.contact){ out.push({k,block:'details',why:`Billing ${!cl.addr&&!cl.contact?'address and contact are':!cl.addr?'address is':'contact is'} missing from the client record.`}); continue; }\n    const c = clone(c0); c.policy='partial'; c.approval='manual';\n    if(a.group!=='config'){ c.group=a.group; Object.values(c.sites).forEach(o=>o.group=null); }\n    if(a.clients.length===1 && a.sites.length) Object.keys(c.sites).forEach(x=>{ if(!a.sites.includes(x)) c.sites[x].on=false; });\n    const pl = planRun(k,p,'Manual run',c);\n    pl.plans.forEach(x=>{ const t=sumLines(x.lines,taxOf(k)); x.sub=t.sub; x.tax=t.tax; x.total=t.total; x.reg=r2(x.lines.filter(l=>l.desc==='Regular hours').reduce((q,l)=>q+l.hrs,0)); x.ot=r2(x.lines.filter(l=>l.desc!=='Regular hours').reduce((q,l)=>q+l.hrs,0)); });\n    out.push({k,pl,paused:c0.status!=='On',nSites:Object.keys(c.sites).filter(x=>c.sites[x].on).length,analyzed:tsInPeriod(k,p,c).length});\n  }\n  a.res = out; a.inc = {}; out.forEach(r=>r.pl&&r.pl.plans.forEach((_,i)=>a.inc[r.k+'|'+i]=true));\n}\nfunction arCounts(){\n  const r = S.ar.res||[], left = r.flatMap(x=>x.pl?x.pl.left.map(l=>({...l,k:x.k})):[]);\n  const by = kind => left.filter(l=>l.kind===kind);\n  const plans = r.flatMap(x=>x.pl?x.pl.plans.map((pl,i)=>({...pl,k:x.k,i})):[]);\n  const elig = plans.reduce((q,x)=>q+x.ids.length,0);\n  return {r,left,by,plans,elig,analyzed:r.reduce((q,x)=>q+(x.analyzed||0),0),sites:r.reduce((q,x)=>q+(x.nSites||0),0),total:r2(plans.reduce((q,x)=>q+x.total,0)),blockedClients:r.filter(x=>x.block)};\n}\nfunction vAutoRun(){\n  if(!S.ar || !S.ar.auto){ S.route='existing'; return vExisting(); }\n  const a = S.ar || (S.ar = arNew());\n  const steps = ['Select billing criteria','Analyze timesheets','Review invoices','Generate'];\n  const stepper = `<ol class=\"arst\" aria-label=\"Progress\">${steps.map((l,i)=>{ const n=i+1, cls=a.done?'done':n<a.step?'done':n===a.step?'cur':''; return `<li class=\"${cls}\" ${n===a.step&&!a.done?'aria-current=\"step\"':''}><span class=\"d\">${cls==='done'?'✓':n}<\/span><span>${l}<\/span><\/li>`; }).join('')}<\/ol>`;\n  const head = pageHead({crumbs:[['Invoices','existing'],['Run Auto Invoicing']],title:`${I.bolt}Run Auto Invoicing`,sub:'Generate draft invoices from approved timesheets for the clients and dates you choose. Uses each client’s billing configuration. Nothing is approved or emailed.',\n    actions:''});\n  let body = '';\n  if(a.auto) return `${pageHead({crumbs:[['Overview','overview'],['Auto Invoicing']],title:`${I.bolt}Auto Invoicing results`,sub:`Run by ${esc(me())} on ${fd(TODAY)}. Every active billing configuration was checked against the approved timesheets.`})}${arAutoDone()}`;\n  if(a.done) body = arDone();\n  else if(a.step===1) body = arStep1();\n  else if(a.step===2) body = arStep2();\n  else body = arStep3();\n  return `${head}${stepper}${body}`;\n}\nfunction arStep1(){\n  const a = S.ar, ks = Object.keys(S.clients).filter(k=>(C(k).status||'Active')==='Active').sort((x,y)=>C(x).name.localeCompare(C(y).name)), allOn = ks.length && ks.every(k=>a.clients.includes(k));\n  const one = a.clients.length===1 ? a.clients[0] : null, oneSites = one ? Object.keys(S.sites).filter(x=>S.sites[x].client===one) : [];\n  const days = Math.round((D(a.to)-D(a.from))/864e5)+1;\n  return `<div class=\"arw\">\n    <section class=\"card\"><div class=\"card-h\"><h2>Billing period<\/h2><p>Pick a standard period or your own dates. Only timesheets dated inside it are considered.<\/p><\/div>\n      <div class=\"seg\" role=\"radiogroup\" aria-label=\"Billing period\">${ARP.map(([v,l])=>`<button role=\"radio\" aria-checked=\"${a.period===v}\" class=\"${a.period===v?'on':''}\" data-act=\"arPer\" data-v=\"${v}\">${l}<\/button>`).join('')}<\/div>\n      <div class=\"dpair ar-d\" style=\"margin-top:18px\">${pkDate('arFrom','Start Date',a.from,'arSet','from')}${pkDate('arTo','End Date',a.to,'arSet','to')}<\/div>\n      <p class=\"help\" style=\"margin-top:8px\">${a.to<a.from?'<span class=\"ferr\">End Date must be on or after Start Date.<\/span>':`${per([a.from,a.to])} · ${plural(days,'day')}${a.period==='custom'?'':' · the last complete '+ARP.find(x=>x[0]===a.period)[1].toLowerCase()+' period'}`}<\/p><\/section>\n    <section class=\"card flush\"><div class=\"card-h pad\"><h2>Clients<\/h2><p>Select one or more clients. Clients without a billing configuration are shown so you can see why they cannot be invoiced yet.<\/p><\/div>\n      <div class=\"arcl-t\"><label class=\"pcb\"><input type=\"checkbox\" data-act=\"arAll\" ${allOn?'checked':''} aria-label=\"Select all clients\">Select All Clients<\/label><span class=\"help\">${plural(a.clients.length,'client')} selected<\/span><span class=\"sp\"><\/span><div class=\"search\">${I.search}<input id=\"arQ\" oninput=\"arQ(this)\" placeholder=\"Search clients\" aria-label=\"Search clients\"><\/div><\/div>\n      <ul class=\"arcl\" id=\"arCl\">${ks.map(k=>{ const c=S.setups[k], n=Object.keys(S.sites).filter(x=>S.sites[x].client===k).length; return `<li data-n=\"${esc(C(k).name.toLowerCase())}\"><label><input type=\"checkbox\" data-act=\"arPick\" data-k=\"${k}\" ${a.clients.includes(k)?'checked':''}><span class=\"nm\"><b>${esc(C(k).name)}<\/b><small>${plural(n,'post site')}${c?` · ${FREQL[c.freq]} schedule · ${groupWords(c)}`:''}<\/small><\/span>${c?st(cfgStatus(c)):`<span class=\"tag warn\">No billing configuration<\/span>`}<\/label><\/li>`; }).join('')}<\/ul><\/section>\n    <section class=\"acc ${a.more?'open':''}\"><button class=\"acc-h\" data-act=\"arMore\" aria-expanded=\"${a.more}\"><span>Optional filters<\/span><span class=\"help\" style=\"margin-left:10px;font-weight:400\">Post site · invoice grouping<\/span><span class=\"sp\"><\/span>${a.more?I.downs:I.right}<\/button>\n      ${a.more?`<div class=\"acc-b\"><div class=\"fgrid\">\n        ${field('arSites','Post sites',one?`<div class=\"arsites\">${oneSites.map(x=>`<label class=\"pcb\"><input type=\"checkbox\" data-act=\"arSite\" data-s=\"${x}\" ${!a.sites.length||a.sites.includes(x)?'checked':''}>${esc(S.sites[x].name)}<\/label>`).join('')}<\/div>`:'<div class=\"ro\">Select exactly one client to choose its post sites. Otherwise every included post site is used.<\/div>')}\n        ${field('arGrp','Invoice grouping',`<select id=\"arGrp\" onchange=\"arSet('group',this.value)\">${[['config','Use each client’s setting'],['combined','One consolidated invoice per client'],['separate','Separate invoice per post site']].map(([v,l])=>`<option value=\"${v}\" ${a.group===v?'selected':''}>${l}<\/option>`).join('')}<\/select>`,{help:'Applies to this run only. Saved configurations are not changed.'})}\n      <\/div><\/div>`:''}<\/section>\n    <div class=\"arf\"><button class=\"btn ghost\" data-act=\"arCancel\">Cancel<\/button><span class=\"sp\"><\/span><button class=\"btn pri\" data-act=\"arGo\" ${a.clients.length&&a.to>=a.from?'':'disabled'}>Analyze Timesheets<\/button><\/div><\/div>`;\n}\nfunction arStep2(){\n  const a = illing exceptions. Warnings are excluded automatically to prevent wrong or duplicate billing.<\/p><\/div>\n      ${!n.left.length&&!n.blockedClients.length?banner('ok','No problems found','Every timesheet in the period is approved, rated and not yet billed.'):''}\n      ${grp('block','Client cannot be invoiced','No configuration or missing billing details. No invoice for these clients.',n.blockedClients,x=>`<li><span>${esc(C(x.k).name)}<\/span><span class=\"muted\">${esc(x.why)}<\/span>${x.block==='nocfg'?`<button class=\"lnk\" data-act=\"cvGo\" data-k=\"${x.k}\">Set up configuration<\/button>`:`<button class=\"lnk\" data-act=\"addDetails\" data-k=\"${x.k}\">Add billing details<\/button>`}<\/li>`)}\n      ${grp('block','Timesheet not approved','Only approved timesheets can be invoiced.',n.by('unapp'),l=>tsRow(l)+(can('fix')?`<button class=\"lnk\" data-act=\"arApprove\" data-id=\"${l.ts}\">Approve<\/button>`:'')+'<\/li>')}\n      ${grp('block','Missing billing rate','The post site has no hourly rate and the client has none to fall back on.',n.by('norate'),l=>tsRow(l)+`<button class=\"lnk\" data-act=\"siteOpen\" data-k=\"${l.k}\" data-s=\"${l.site}\">Set rate<\/button><\/li>`)}\n      ${grp('warn','Already billed','Left off so nothing is billed twice.',n.by('dup'),l=>tsRow(l)+`<button class=\"lnk\" data-act=\"openInv\" data-id=\"${(l.why.match(/\\d{4,}/)||[''])[0]}\">Open invoice<\/button><\/li>`)}\n      ${grp('warn','Non-billable','Marked as non-billable on the timesheet.',n.by('nb'),l=>tsRow(l)+'<\/li>')}\n      ${n.r.some(x=>x.paused)?`<p class=\"help\" style=\"margin-top:12px\">Scheduled runs are paused or inactive for ${n.r.filter(x=>x.paused).map(x=>esc(C(x.k).name)).join(', ')}. This manual run still bills the selected period.<\/p>`:''}\n    <\/section>\n    <div class=\"arf\"><button class=\"btn ghost\" data-act=\"arBack\">Back<\/button><button class=\"btn sec\" data-act=\"arGo\">Re-analyze<\/button><span class=\"sp\"><\/span><button class=\"btn pri\" data-ac igit year, e.g. 2024.';\n    if(v.plate && vehicles().some(x=>x.plate.toLowerCase()===v.plate.trim().toLowerCase()&&x.id!==v.id)) err.plate='A vehicle with this license plate already exists.';\n    if(Object.keys(err).length){ S.f.vdErr=err; render(); return toast(`Fill in ${plural(Object.keys(err).length,'required field')}.`,'e'); }\n    const rec={...v,year:String(v.year).trim(),make:v.make.trim(),model:v.model.trim(),plate:v.plate.trim().toUpperCase()};\n    if(v.id){ Object.assign(vehicles().find(x=>x.id===v.id),rec); toast(`${esc(rec.make)} ${esc(rec.model)} saved.`); }\n    else { vehicles().unshift({...rec,id:'v'+Date.now().toString(36),archived:false}); toast(`${esc(rec.make)} ${esc(rec.model)} added. It can now be picked on dispatch tickets.`); }\n    log(v.id?'Vehicle updated':'Vehicle added','—',`${rec.year} ${rec.make} ${rec.model} · ${rec.plate}`); S.vd=null; S.f.vdErr={}; go('dveh'); },\n  vExp:el=>{ S.f.vOpen=S.f.vOpen||{}; S.f.vOpen[el.dataset.id]=!S.f.vOpen[el.dataset.id]; render(); },\n  vToggleAll:()=>{ const ids=vRows().map(v=>v.id), all=ids.every(i=>(S.f.vOpen||{})[i]); S.f.vOpen=Object.fromEntries(ids.map(i=>[i,!all])); render(); },\n  vPick:(el,ev)=>{ ev.stopPropagation(); const s2=new Set(S.f.vSel||[]); s2.has(el.dataset.id)?s2.delete(el.dataset.id):s2.add(el.dataset.id); S.f.vSel=[...s2]; render(); },\n  vAll:()=>{ const ids=vRows().map(v=>v.id), sel=S.f.vSel||[]; S.f.vSel = ids.every(i=>sel.includes(i)) ? sel.filter(i=>!ids.includes(i)) : [...new Set([...sel,...ids])]; render(); },\n  vAction:el=>{ const n=(S.f.vSel||[]).length, r=el.getBoundingClientRect();\n    document.getElementById('layer').innerHTML = `<div class=\"ov clear\" data-act=\"bg\"><\/div><div class=\"menu\" role=\"menu\" style=\"top:${r.bottom+6}px;left:${r.left}px\"><button role=\"menuitem\" data-act=\"vArc\" ${n?'':'disabled title=\"Select vehicles first\"'}>Archive${n?` (${n})`:''}<\/button><button role=\"menuitem\" class=\"dz\" data-act=\"vDel\" ${n?'':'disabled title=\"Select vehicles first\"'}>Delete${n?` (${n})`:''}<\/button><\/div>`; },\n  vArc:el=>{ const ids=el.dataset.id?[el.dataset.id]:(S.f.vSel||[]); const back=el.dataset.restore==='1';\n    confirmDlg(`${back?'Restore':'Archive'} ${ids.length===1?'this vehicle':plural(ids.length,'vehicle')}?`,`<p>${back?'It becomes available on dispatch tickets again.':'Archived vehicles cannot be picked on new dispatch tickets. You can restore them later.'}<\/p>`,back?'Restore':'Archive',`data-act=\"vArcGo\" data-ids=\"${ids.join(',')}\" data-restore=\"${back?1:0}\"`); },\n  vArcGo:el=>{ const ids=el.dataset.ids.split(','), back=el.dataset.restore==='1'; vehicles().forEach(v=>{ if(ids.includes(v.id)) v.archived=!back; }); S.f.vSel=[]; closeLayer(); render(); toast(`${plural(ids.length,'vehicle')} ${back?'restored':'archived'}.`); },\n  vDel:el=>{ const ids=el.dataset.id?[el.dataset.id]:(S.f.vSel||[]); confirmDlg(`Delete ${ids.length===1?'this vehicle':'selected items'}?`,'<p>This cannot be undone. Dispatch tickets that used it keep the vehicle name.<\/p>','Delete',`data-act=\"vDelGo\" data-ids=\"${ids.join(',')}\"`,true); },\n  vDelGo:el=>{ const ids=el.dataset.ids.split(','); S.vehs=vehicles().filter(v=>!ids.includes(v.id)); S.f.vSel=[]; closeLayer(); render(); toast(`${plural(ids.length,'vehicle')} deleted.`); },\n  vFilters:()=>vFilterDrawer(),\n  vFilterGo:()=>{ S.f.vFlt={cat:document.getElementById('vfCat').value,status:document.getElementById('vfSt').value}; closeLayer(); render(); },\n  vClear:()=>{ S.f.vFlt={status:'Active'}; S.f.vQ=''; render(); },\n});\n\n\n/* Create Invoice › Calculate Hours, Hits or Dispatch (existing drawer + new Dispatch option) */\nconst SKILLS = ['Unarmed Guard','Armed Guard','Supervisor','Patrol Officer'], DEPTS = ['Operations','Mobile Patrol','Events'];\nconst hsh = str => [...str].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);\nfunction calcDrawer(i){\n  const c = S.f.calc || (S.f.calc = {i, type:'Hours', from:'', ft:'', to:'', tt:'', skill:'', dept:'', dtype:'', pick:[], ran:false}); c.i = i;\n  const isD = c.type==='Dispatch';\n  document.getElementById('layer').innerHTML = `<div class=\"ov drawer-ov\" data-act=\"bg\"><aside class=\"drawer\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Calculate Hours, Hits or Dispatch\"><div class=\"dh\"><h3>Calculate Hours, Hits or Dispatch<\/h3><button class=\"ibtn\" data-act=\"close\" aria-label=\"Close\">${I.x}<\/button><\/div>\n    <div class=\"db\" style=\"flex:1\">\n      ${of('cType','Select*',`<select id=\"cType\" onchange=\"calcSet('type',this.value,1)\">${[['Hours','Hours'],['Hits','Number of Hits'],['Dispatch','Dispatch']].map(([v,l])=>`<option value=\"${v}\" ${c.type===v?'selected':''}>${l}<\/option>`).join('')}<\/select>`)}\n      ${isD?`<p class=\"help\" style=\"margin-top:-6px\">Counts dispatch tickets for the client${S.ied.site?' and post site':''} on this invoice in the date range. <span class=\"new enh\">ENHANCED<\/span><\/p>`:''}\n      <div class=\"dpair\">${pkDate('cFrom','From Date',c.from,'calcSet','from')}${pkTime('cFt','Time',c.ft,'calcSet','ft')}<\/div>\n      <div class=\"dpair\">${pkDate('cTo','To Date',c.to,'calcSet','to')}${pkTime('cTt','Time',c.tt,'calcSet','tt')}<\/div>\n      ${isD ? of('cDtype','Incident Type',`<select id=\"cDtype\" onchange=\"calcSet('dtype',this.value)\"><option value=\"\">All incident types<\/option>${DTYPES.map(o=>`<option ${c.dtype===o?'selected':''}>${o}<\/option>`).join('')}<\/select>`)\n      : `${of('cSkill','',`<select id=\"cSkill\" onchange=\"calcSet('skill',this.value)\" aria-label=\"Skill set\"><option value=\"\">Skill Set<\/option>${SKILLS.map(o=>`<option ${c.skill===o?'selected':''}>${o}<\/option>`).join('')}<\/select>`)}\n        ${of('cDept','',`<select id=\"cDept\" onchange=\"calcSet('dept',this.value)\" aria-label=\"Department\"><option value=\"\">Department<\/option>${DEPTS.map(o=>`<option ${c.dept===o?'selected':''}>${o}<\/option>`).join('')}<\/select>`)}`}\n      <div id=\"cPrev\">${c.ran?calcTable():''}<\/div>\n    <\/div>\n    <div class=\"df\"><button class=\"btn pri\" data-act=\"calcRun\">${c.ran?'Recalculate':'Calculate'}<\/button><\/div><\/aside><\/div>`;\n}\n/* breakdown rows for the selected type; the user ticks which ones become the line quantity */\nfunction calcRows(){\n  const c = S.f.calc, e = S.ied; if(!e || !e.client) return {err:'Select a client on the invoice first.'};\n  if(c.to && c.from && c.to < c.from) return {err:'To Date must be after From Date.'};\n  const sites = e.site ? [e.site] : Object.keys(S.sites).filter(k=>S.sites[k].client===e.client);\n  const inRange = d => (!c.from || d>=c.from) && (!c.to || d<=c.to);\n  if(c.type==='Dispatch'){\n    S.disp = S.disp || DISP0();\n    const list = S.disp.filter(t=>!t.deleted && sites.includes(t.site) && inRange(t.at.slice(0,10)) && (!c.dtype || t.type===c.dtype));\n    const cl = list.filter(t=>!t.open), op = list.filter(t=>t.open);\n    return {title:'Select Dispatch', unit:'dispatch ticket', rows:[['closed','Closed Tickets',cl.length,cl],['open','Open Tickets',op.length,op],['total','Total Dispatch Tickets',list.length,list]]};\n  }\n  const ts = Object.values(S.ts).filter(t=>sites.includes(t.site) && t.status==='Approved' && inRange(t.date)\n    && (!c.skill || SKILLS[hsh(t.guard)%SKILLS.length]===c.skill) && (!c.dept || DEPTS[hsh(t.guard+'d')%DEPTS.length]===c.dept));\n  if(c.type==='Hits') return {title:'Select Hits', unit:'hit', note:'Simulated: 4 checkpoint scans per approved shift.', rows:[['hits','Number of Hits',ts.length*4]]};\n  const reg = r2(ts.reduce((a,t)=>a+t.hrs,0)), ot = r2(ts.reduce((a,t)=>a+(t.ot||0),0)), pto = 0;\n  return {title:'Select Hours', unit:'hour', rows:[['reg','Regular Hours',reg],['pto','Paid Time Off',pto],['ot15','Overtime at 1.5X',ot],['ot16','Overtime at 1.6X',0],['ot2','Overtime at 2X',0],['ot25','Overtime at 2.5X',0],['ot3','Overtime at 3X',0],['total','Total Hours',r2(reg+pto+ot)]]};\n}\nfunction calcTable(){\n  const r = calcRows(), c = S.f.calc; if(r.e -------------- state ---------------- */\nlet S;\n/* the Backoffice already uses BK-1001 … BK-1014 (other clients included), so new requests start at BK-1015 */\nlet bkN = 1015, refN = 10520, pmN = 4;\n\n/* ---------------- link with the Backoffice ----------------\n   Same protocol as the Backoffice prototype: bookings and estimates are stored in\n   localStorage under LINK_KEY as {bks:{no:record}, ests:{no:record}, rev}. Each page\n   writes the records it changes and applies the other page's records over its sample\n   data, so both pages show the same bookings and estimates in the same browser. */\nconst LINK_KEY = 'guardspro-link-v1';\nfunction linkRead(){ try{ return JSON.parse(localStorage.getItem(LINK_KEY)||'null'); }catch(e){ return null; } }\nfunction linkWrite(L){ try{ localStorage.setItem(LINK_KEY, JSON.stringify(L)); }catch(e){} }\nfunction linkPut(kind, rec){ if(!rec) return; const L = linkRead() || {bks:{}, ests:{}}; L[kind] = L[kind] || {};\n  const v = clone(rec); if(kind==='ests') v.siteName = estSite(rec);\n  L[kind][v.no] = v; L.rev = (L.rev||0)+1; linkWrite(L); }\nconst linkBk = b => linkPut('bks', b);\nconst linkEst = e => linkPut('ests', e);\nfunction linkApply(){\n  const L = linkRead(); if(!L) return;\n  Object.values(L.bks||{}).forEach(b=>{ if(!b || b.client!==CLIENT_ID) return;\n    const v=clone(b), i=S.bks.findIndex(x=>x.no===b.no); if(i<0) S.bks.push(v); else S.bks[i]=v;\n    if(b.newSite && !S.sites.some(x=>x.name===b.site)) S.sites.push({id:b.siteId||'', name:b.site, addr:b.newSite.addr||'', contact:b.newSite.contact||'', email:b.newSite.email||'', phone:b.newSite.phone||'', isNew:true});\n    const st=S.sites.find(x=>x.name===b.site); if(st && b.siteId && !st.id) st.id=b.siteId; });\n  Object.values(L.ests||{}).forEach(e=>{ if(!e) return; const i=S.ests.findIndex(x=>x.no===e.no);\n    /* deleted estimates and drafts are not shown to the client */\n    if(e.deleted || e.client!==CLIENT_ID || e.status==='Draft'){ if(i>=0 && (e.deleted || e.status==='Draft')) S.ests.splice(i,1); return; }\n    const v=clone(e); if(i<0) S.ests.push(v); else S.ests[i]=v; });\n  bkN = Math.max(bkN, ...Object.keys(L.bks||{}).map(n=>(+String(n).replace(/\\D/g,'')||0)+1));\n}\nwindow.addEventListener('storage', ev=>{ if(ev.key!==LINK_KEY) return;\n  /* the Backoffice's Reset demo cleared the shared records: start over from the sample data */\n  if(ev.newValue===null){ const r=S.route, sel=S.sel, open=S.navOpen; closeLayer(); reset(); S.route=r; S.sel=sel; S.navOpen=open; render(); return; }\n  linkApply();\n  if(S.route!=='bookingNew' && !document.getElementById('layer').innerHTML) render(); });\nfunction reset(){\n  S = {route:'dashboard', sel:null, navOpen:false, sites:clone(SITES0), bks:clone(BK0), ests:clone(EST0), invs:clone(INV0), pays:clone(PAY0), pms:clone(PM0), bf:null,\n       f:{bq:'', bst:'', eq:'', est:'', iq:'', ist:''}};\n  S.pays.forEach(p=>{ p.amount = invTotal(S.invs.find(i=>i.no===p.no)); });\n  /* post sites a booking asked to add appear in the site list */\n  S.bks.forEach(b=>{ if(b.newSite && !S.sites.some(x=>x.name===b.site)) S.sites.push({id:'', ...b.newSite, isNew:true}); });\n  linkApply();\n}\n\n/* ---------------- icons ---------------- */\nconst IC = {\n  Dashboard:'<path d=\"M12 3a9 9 0 1 0 9 9h-9z\"/><path d=\"M15 2.5A7 7 0 0 1 21.5 9H15z\"/>',\n  Activity:'<path d=\"M20.6 10.5A9 9 0 1 1 13.5 3.1\"/><path d=\"M7 14.5l3.2-4 3 2.6 3.3-4.1\"/><circle cx=\"19\" cy=\"5\" r=\"2\"/>',\n  'Post Orders':'<circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"4.5\"/><circle cx=\"12\" cy=\"12\" r=\"1.2\" fill=\"currentColor\"/>',\n  'GPS Tracker':'<circle cx=\"12\" cy=\"9.5\" r=\"6.5\"/><circle cx=\"12\" cy=\"8.5\" r=\"2\"/><path d=\"M8.6 13.4a4 4 0 0 1 6.8 0\"/><path d=\"M6.5 17.5C4.6 18 3.5 18.8 3.5 19.6c0 1.3 3.8 2.4 8.5 2.4s8.5-1.1 8.5-2.4c0-.8-1.1-1.6-3-2.1\"/>',\n  'Time Clock':'<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>',\n  Reports:'<circle cx=\"12\" cy=\"12\ t crumbs = (...c) => `<nav class=\"crumbs\" aria-label=\"Breadcrumb\"><a data-act=\"go\" data-r=\"bookings\">Invoicer<\/a>${c.map(([l,r],i)=>`<span>/<\/span>${r&&i<c.length-1?`<a data-act=\"go\" data-r=\"${r}\">${l}<\/a>`:`<span ${i===c.length-1?'aria-current=\"page\"':''}>${l}<\/span>`}`).join('')}<\/nav>`;\nconst searchFld = (k,ph,label='Search') => `<div class=\"fld search\"><label for=\"f-${k}\">${label}<\/label>${I.search}<input id=\"f-${k}\" value=\"${esc(S.f[k])}\" placeholder=\"${ph}\" data-in=\"${k}\"><\/div>`;\nconst selFld = (k,label,opts,all='All statuses') => `<div class=\"fld\"><label for=\"f-${k}\">${label}<\/label><select id=\"f-${k}\" data-ch=\"${k}\"><option value=\"\">${all}<\/option>${opts.map(o=>`<option ${S.f[k]===o?'selected':''}>${o}<\/option>`).join('')}<\/select><\/div>`;\nconst clearBtn = keys => keys.some(k=>S.f[k]) ? `<button class=\"btn ghost\" data-act=\"fclear\" data-k=\"${keys.join(',')}\" style=\"height:44px\">Clear filters<\/button>` : '';\nconst emptyRow = (n,t,s) => `<tr><td colspan=\"${n}\"><div class=\"empty\"><b>${t}<\/b>${s}<\/div><\/td><\/tr>`;\n\n/* ---------------- dashboard (existing screen) ---------------- */\nfunction vDashboard(){\n  const kp = (n,col,l,s='') => `<div class=\"card kpi\"><b style=\"color:${col}\">${n}<\/b><span>${l} ${s?`<small>${s}<\/small>`:''}<\/span><\/div>`;\n  return `<div class=\"mw\"><button class=\"btn sq\" data-act=\"stub\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0\"/><circle cx=\"16\" cy=\"6\" r=\"2\"/><circle cx=\"10\" cy=\"12\" r=\"2\"/><circle cx=\"18\" cy=\"18\" r=\"2\"/><\/svg>Manage Widgets<\/button><\/div>\n  <div class=\"cards\">${kp(4,'#2f6fe0','Post Sites')}${kp(20,'#d64032','Guards')}${kp(0,'#f0a020','Site Tours','(Last 7 Days)')}${kp(0,'var(--fg)','Incidents','(Last 7 Days)')}<\/div>\n  <section class=\"card tracker\"><div class=\"hd\"><h2>Live Tracker<\/h2><span><span class=\"sw\"><\/span>Show Geo-Fence<\/span><span style=\"border-left:1px solid var(--line);padding-left:20px\">Roadmap ▾<\/span><\/div>\n    <div class=\"map\">${mapSvg()}<div class=\"mapt\"><span class=\"on\">Map<\/span><span>Satellite<\/span><\/div><\/div><\/section>`;\n}\nfunction mapSvg(){\n  let seed=11; const rnd=()=> (seed=(seed*9301+49297)%233280)/233280; const o=[];\n  o.push('<rect width=\"1200\" height=\"430\" fill=\"#eceef0\"/>');\n  for(let y=0;y<430;y+=46) for(let x=0;x<1200;x+=62){ o.push(`<rect x=\"${x+4}\" y=\"${y+4}\" width=\"54\" height=\"38\" fill=\"${rnd()<.07?'#d6ecd2':rnd()<.1?'#f7efd9':'#f4f5f6'}\"/>`); }\n  for(let y=0;y<430;y+=46) o.push(`<rect x=\"0\" y=\"${y}\" width=\"1200\" height=\"4\" fill=\"#fff\"/>`);\n  for(let x=0;x<1200;x+=62) o.push(`<rect x=\"${x}\" y=\"0\" width=\"4\" height=\"430\" fill=\"#fff\"/>`);\n  o.push('<path d=\"M260 0 L420 430\" stroke=\"#8fa4c7\" stroke-width=\"16\" opacity=\".8\"/><path d=\"M380 430 L1100 60\" stroke=\"#9fb2d6\" stroke-width=\"9\"/><path d=\"M200 0 C 230 140 180 260 240 430\" stroke=\"#a9d1ef\" stroke-width=\"7\" fill=\"none\"/>');\n  o.push('<g transform=\"translate(700 190)\"><path d=\"M0 30 C-15 12 -17 4 -17 -3 A17 17 0 1 1 17 -3 C17 4 15 12 0 30z\" fill=\"#a43ec2\" stroke=\"#fff\" stroke-width=\"2\"/><rect x=\"-7\" y=\"-9\" width=\"14\" height=\"11\" rx=\"2\" fill=\"#fff\"/><\/g>');\n  return `<svg viewBox=\"0 0 1200 430\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"Live map of guards at Harborview post sites\">${o.join('')}<\/svg>`;\n}\nfunction vStub(){ return `<div class=\"card empty\" style=\"margin-top:20px\"><b>${esc(S.sel||'This screen')}<\/b>This is an existing GuardsPro Client Portal screen and is not part of this prototype.<\/div>`; }\n\n/* ======================= 1. BOOKINGS ======================= */\nfunction vBookings(){\n  const q=S.f.bq.trim().toLowerCase();\n  let rows = S.bks.slice().sort((a,b)=>b.on.localeCompare(a.on)||b.no.localeCompare(a.no));\n  if(q) rows = rows.filter(b=>b.no.toLowerCase().includes(q)||b.site.toLowerCase().includes(q));\n  if(S.f.bst) rows = rows.filter(b=>b.status===S.f.bst);\n  return `${crumbs(['Bookings'])}\n  <div class=\"ph\"><div><h1>Bookings<\/h1><span class=\"sub\">Request guard services from ${esc(BILLER.name)}. You will receive an estimate for each booking.<\/span><\/div><span class=\"sp\"><\/span><button class=\"btn pri\" data-act=\"bkNew\">${I.plus}New Booking<\/button><\/div>\n  <div class=\"toolbar\">${searchFld('bq','Booking number or post site')}${selFld('bst','Status',Object.keys(BK_CLS))}${clearBtn(['bq','bst'])}<\/div>\n  <div class=\"card\"><div class=\"tw\"><table><thead><tr><th>Booking Number<\/th><th>Requested On<\/th><th>Post Site<\/th><th>Service<\/th><th>Schedule<\/th><th>Service Period<\/th><th class=\"r\">Guards<\/th><th>Estimate<\/th><th class=\"r\">Amount Due<\/th><th>Status<\/th><\/tr><\/thead><tbody>\n  ${rows.map(b=>{ const s=b.scheds[0], more=b.scheds.length-1, site=bkSite(b), e=bkEstOf(b);\n    return `<tr class=\"click\" data-act=\"bkOpen\" data-no=\"${b.no}\"><td class=\"num\"><button class=\"lnk\" data-act=\"bkOpen\" data-no=\"${b.no}\">${b.no}<\/button><\/td><td class=\"num\">${fd(b.on)}<\/td>\n    <td style=\"max-width:220px\">${esc(b.site)}${site.isNew?'<span class=\"sub\">New post site<\/span>':''}<\/td><td>${bkType(b)}<\/td>\n    <td>${schedDays(s)}<span class=\"sub\">${schedTime(s)}${more?` · +${more} more schedule${more>1?'s':''}`:''}<\/span><\/td>\n    <td class=\"num\">${schedWhen(s)}<\/td><td class=\"r num\">${b.scheds.reduce((a,x)=>a+ +x.guards,0)}<\/td>\n    <td>${e?`<button class=\"lnk\" data-act=\"estOpen\" data-no=\"${e.no}\">${e.no}<\/button>`:`<span style=\"color:var(--muted)\">${b.status==='Requested'?'Awaiting':'—'}<\/span>`}<\/td>\n    <td class=\"r num\">${e&&e.status!=='Declined'?`<b>${usd(amtLeft(e))}<\/b><span class=\"sub\">${amtLeft(e)===0?'Paid in full':invPaidFor(e)?`${usd(invPaidFor(e))} paid on invoice`:e.depPaid&&depOf(e)?`${usd(depOf(e))} deposit paid`:`of ${usd(estTotal(e))}`}<\/span>`:'<span style=\"color:var(--muted)\">—<\/span>'}<\/td><td>${pill(BK_CLS,b.status)}<\/td><\/tr>`; }).join('')\n    || emptyRow(10,'No bookings found', S.bks.length?'Change the search or filters.':'Use New Booking to request guard services.')}\n  <\/tbody><\/table><\/div><\/div>`;\n}\n\nfunction vBooking(){\n  const b=S.bks.find(x=>x.no===S.sel); if(!b){ S.route='bookings'; return vBookings(); }\n  const site=bkSite(b), e=bkEstOf(b);\n  const banner = {\n    'Requested':()=>`<div class=\"note\"><b>Booking requested.<\/b> ${esc(BILLER.name)} is reviewing it and will send you an estimate.<\/div>`,\n    'Estimate Sent':()=> e ? `<div class=\"note\"><b>Estimate ${e.no} is ready.<\/b> ${depOf(e)?`Approve it and pay the deposit of ${usd(depOf(e))} by ${fd(e.expire)} to confirm this booking.`:`Review it and approve or decline it by ${fd(e.expire)}.`} <button class=\"lnk\" data-act=\"estOpen\" data-no=\"${e.no}\">View estimate<\/button><\/div>` : `<div class=\"note\"><b>An estimate was sent for this booking.<\/b> It will appear under Estimates.<\/div>`,\n    'Confirmed':()=> e && depState(e)==='due' ? `<div class=\"note w\"><b>Booking confirmed. Deposit of ${usd(depOf(e))} is due.<\/b> <button class=\"lnk\" data-act=\"estPayDep\" data-no=\"${e.no}\">Pay deposit<\/button><\/div>`\n      : `<div class=\"note\" style=\"background:var(--good-bg);color:#0d5e44\"><b>Booking confirmed.<\/b> ${e&&depState(e)==='paid'?`Deposit of ${usd(depOf(e))} paid on ${fd(e.depPaid)}. `:''}Charges will appear on your invoices once service starts.<\/div>`,\n    'Declined':()=> b.declinedBy==='DSS' ? `<div class=\"note e\"><b>${esc(BILLER.name)} declined this booking.<\/b> ${b.declineWhy?'Reason: '+esc(b.declineWhy)+'. ':''}Contact ${esc(BILLER.email)} or request a new booking.<\/div>`\n      : `<div class=\"note n\"><b>The estimate for this booking was declined.<\/b> ${e&&e.declineWhy?'Reason: '+esc(e.declineWhy):''}<\/div>`,\n    'Cancelled':()=>`<div class=\"note n\"><b>You cancelled this booking request.<\/b><\/div>`}[b.status]();\n  return `${crumbs(['Bookings','bookings'],[b.no])}\n  <div class=\"ph\"><button class=\"iconbtn\" data-act=\"go\" data-r=\"bookings\" aria-label=\"Back to bookings\">${I.back}<\/button><h1>Booking ${b.no}<\/h1>${pill(BK_CLS,b.status)}<span class=\"sp\"><\/span>\n    ${b.status==='Requested'?`<button class=\"btn sec\" data-act=\"bkCancel\">Cancel Booking<\/button>`:''}${e?`<button class=\"btn pri\" data-act=\"estOpen\" data-no=\"${e.no}\">View Estimate ${e.no}<\/button>`:''}<\/div>\n  ${banner}\n  <div style=\"display:flex;flex-direction:column;gap:24px\">\n    <section class=\"card sec\"><h2>Booking Details<\/h2><dl class=\"dl\">\n      <div><dt>Booking Number<\/dt><dd>${b.no}<\/dd><\/div><div><dt>Requested On<\/dt><dd>${fd(b.on)}<span class=\"sub\">by ${esc(b.by||CLIENT.user)}<\/span><\/dd><\/div><div><dt>Status<\/dt><dd>${pill(BK_CLS,b.status)}<\/dd><\/div>\n      <div><dt>Post Site<\/dt><dd>${esc(site.name)}<span class=\"sub\">${esc(site.addr)}<\/span><\/dd><\/div><div><dt>Service<\/dt><dd>${bkType(b)}<\/dd><\/div><div><dt>Schedules<\/dt><dd>${b.scheds.length}<\/dd><\/div>\n      ${e&&e.status!=='Declined'?`<div><dt>Total Amount<\/dt><dd>${usd(estTotal(e))}<span class=\"sub\">Estimate ${e.no}<\/span><\/dd><\/div><div><dt>Amount Due<\/dt><dd><b>${usd(amtLeft(e))}<\/b><span class=\"sub\">${amtLeft(e)===0?'Paid in full':depOf(e)?(e.depPaid?`${usd(depOf(e))} deposit paid`:`${usd(depOf(e))} deposit not paid yet`):'No deposit'}<\/span><\/dd><\/div>\n      ${estInvs(e).length?`<div><dt>Invoices<\/dt><dd>${estInvs(e).map(i=>`<button class=\"lnk\" data-act=\"invOpen\" data-no=\"${i.no}\">${i.no}<\/button> ${pill(INV_CLS,invStatus(i))}`).join(' ')}<\/dd><\/div>`:''}`:''}\n      ${site.isNew?`<div><dt>Site Contact<\/dt><dd>${esc(site.contact||'—')}<span class=\"sub\">${esc([site.email,site.phone].filter(Boolean).join(' · '))}<\/span><\/dd><\/div>`:''}\n    <\/dl>${site.isNew?'<p class=\"sub\" style=\"margin-top:14px\">New post site. DSS adds it to your account when they prepare the estimate.<\/p>':''}<\/section>\n    <section class=\"card\"><div class=\"sec\" style=\"padding-bottom:6px\"><h2 style=\"margin:0\">Schedules<\/h2><\/div><div class=\"tw\"><table><thead><tr><th>#<\/th><th>Service Request<\/th><th>Days<\/th><th>Shift<\/th><th>Dates<\/th><th class=\"r\">Guards<\/th><\/tr><\/thead><tbody>\n      ${b.scheds.map((s,i)=>`<tr><td class=\"num\">${i+1}<\/td><td>${s.type==='one'?'One Time':'Repeat'}<\/td><td>${s.type==='one'?'—':daysTxt(s.days)}<\/td><td class=\"num\">${schedTime(s)}<\/td><td class=\"num\">${schedWhen(s)}<\/td><td class=\"r num\">${s.guards}<\/td><\/tr>\n        ${s.details?`<tr><td><\/td><td colspan=\"5\" style=\"border-top:0;padding-top:0;color:var(--fg-2)\"><span class=\"hint\">Details:<\/span> ${esc(s.details)}<\/td><\/tr>`:''}`).join('')}\n    <\/tbody><\/table><\/div><\/section>\n    ${bkLogsCard(b)}\n    <p class=\"sub\" style=\"margin:-8px 0 0\">Questions about this booking? Contact ${esc(BILLER.email)}.<\/p><\/div>`;\n}\n\n/* ---- New booking form ---- */\nconst blankSched = () => ({type:'', days:[], t1:'', t2:'', from:'', to:'', guards:'', details:'', err:{}});\nconst blankBF = () => ({site:'', ns:{name:'', addr:'', contact:'', email:'', phone:''}, scheds:[blankSched()], err:{}});\nconst ferr = (e,k) => e[k] ? `<span class=\"ferr\">${e[k]}<\/span>` : '';\n\nfunction vBookingNew(){\n  const f=S.bf, e=f.err, nsF = (k,l,req,attrs='',cls='') => `<div class=\"fld ${cls}\"><label for=\"ns-${k}\">${l}${req?' <i class=\"req\">*<\/i>':''}<\/label><input id=\"ns-${k}\" data-bfn=\"${k}\" value=\"${esc(f.ns[k])}\" ${attrs} class=\"${e['ns_'+k]?'bad':''}\">${ferr(e,'ns_'+k)}<\/div>`;\n  return `${crumbs(['Bookings','bookings'],['New Booking'])}\n  <div class=\"ph\"><button class=\"iconbtn\" data-act=\"go\" data-r=\"bookings\" aria-label=\"Back to bookings\">${I.back}<\/button><h1>New Booking<\/h1><\/div>\n  <div class=\"qform\">\n
